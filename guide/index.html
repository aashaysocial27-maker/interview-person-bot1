<title>AI Engineering Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook column; session switcher on top, numbered lessons as expandable entries, PM mapping and next step below. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eceef3; --fg:#171a21; --muted:#5b6170;
  --line:#d9dce4; --accent:#3a4fd6; --accent-soft:#e3e7fb; --accent-fg:#ffffff;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --bad:#c2410c; --bad-soft:#fde7dc;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1a1d25; --sunk:#232733; --fg:#e8eaf0; --muted:#9aa0b0;
  --line:#2e3341; --accent:#8b9bff; --accent-soft:#262c4d; --accent-fg:#10121a;
  --ok:#4fd19a; --ok-soft:#173a2b; --bad:#ff9a6b; --bad-soft:#3d2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1a1d25; --sunk:#232733; --fg:#e8eaf0; --muted:#9aa0b0;
  --line:#2e3341; --accent:#8b9bff; --accent-soft:#262c4d; --accent-fg:#10121a;
  --ok:#4fd19a; --ok-soft:#173a2b; --bad:#ff9a6b; --bad-soft:#3d2219; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.sheet{background:var(--bg);border-radius:14px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.eyebrow{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--sunk);padding:1px 6px;border-radius:5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:14px;background:var(--bg);padding:8px 0}
.lede{color:var(--muted);max-width:62ch}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab.add{border-style:dashed;color:var(--muted);cursor:default}

.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.progress b{font-variant-numeric:tabular-nums;color:var(--fg)}

.section{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--accent);font-size:14px;padding:4px 0}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lesson.done{border-color:var(--ok)}
.lesson-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;width:100%;
  text-align:left;background:none;border:none;padding:16px 18px}
.num{font:600 14px/1 var(--mono);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.lesson.done .num{background:var(--ok-soft);color:var(--ok)}
.lesson-head h3{padding-top:3px}
.chev{width:22px;height:22px;margin-top:4px;color:var(--muted);transition:transform .2s}
.lesson.open .chev{transform:rotate(180deg)}
.lesson-body{padding:0 18px 18px 62px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lesson-body p{max-width:66ch}
.done-toggle{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:14px;
  border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:8px}
.lesson.done .done-toggle{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

.widget{background:var(--sunk);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.widget .eyebrow{font-size:11px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;
  display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.step small{font:500 11px var(--mono);color:var(--muted)}
.step.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.flow-note{font:13px var(--mono);color:var(--muted)}

/* swap */
.swap{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font:13px/1.5 var(--mono)}
pre .hl{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}

/* tradeoffs */
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px}
.pair button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pair span{font:12px var(--mono);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:12px var(--mono);padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}

/* temperature */
.temp-row{display:flex;align-items:center;gap:12px}
.temp-row input{flex:1;accent-color:var(--accent)}
.temp-val{font:600 15px var(--mono);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.scale{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.temp-out{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}

/* error table + quiz */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:none}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz-q{font:500 15px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;text-align:left}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);gap:8px;flex-wrap:wrap}
.quiz-foot b{font-variant-numeric:tabular-nums;color:var(--fg)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:default}

/* PM */
.pm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pm h3{font-size:16px}
.pm p{font-size:15px;color:var(--muted)}

.next{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.next .eyebrow{color:var(--accent)}
.fields{display:flex;gap:6px;flex-wrap:wrap}
.fields .tag{background:var(--surface)}

/* block diagrams */
.dg-wrap{background:var(--sunk);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dg-wrap .eyebrow{font-size:11px}
.dg{display:flex;align-items:center;min-width:0}
.dg-col{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0}
.node{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.node small{display:block;font:400 11px/1.35 var(--mono);color:var(--muted);margin-top:3px}
.node.accent{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.node.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.node.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.node.ghost{border-style:dashed;background:transparent;color:var(--muted);font-weight:500}
.node.accent small,.node.ok small,.node.bad small{color:inherit;opacity:.8}
.dg-arrow{flex:0 0 26px;display:grid;place-items:center;color:var(--muted)}
.dg-arrow svg{width:22px;height:22px}
.dg.v{flex-direction:column;align-items:stretch}
.dg.v .dg-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
.dg.v .dg-col .node{flex:1 1 140px}
.dg.v .dg-arrow{flex-basis:24px}
.dg.v .dg-arrow svg{transform:rotate(90deg)}
.dg-cap{font-size:13px;color:var(--muted)}
.pm-dgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){
  .dg{flex-direction:column;align-items:stretch}
  .dg-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .dg-col .node{flex:1 1 130px}
  .dg-arrow{flex-basis:24px}
  .dg-arrow svg{transform:rotate(90deg)}
  .pm-dgs{grid-template-columns:1fr}
}

/* notebook */
.nb-body{display:flex;flex-direction:column;gap:10px}
.nb-cell{min-width:0}
.nb-md{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.nb-md ol{margin:0;padding-left:22px}
.nb-h{font-family:var(--display);font-weight:600}
.nb-h1{font-size:20px}.nb-h2{font-size:17px}
.nb-bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:0 2px 4px}
.nb-copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:12px}
.nb pre{white-space:pre;tab-size:4}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);text-align:center}

@media (max-width:600px){
  .lesson-body{padding:0 14px 16px 14px}
  .lesson-head{padding:14px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .pm-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ============================================================
   CONTENT — add new sessions to this array.
   Each lesson: { title, body: [paragraph html...], widget?: key }
   ============================================================ */
const SESSIONS = [
  {
    id: "calling-llms-through-apis",
    label: "Calling LLMs through APIs",
    title: "Calling LLMs through APIs",
    notebook: { file: "Calling_LLMs_through_APIs.ipynb", cells: [{"t": "markdown", "s": "# Connect to AI models from different platforms\nSame pattern for every platform:\n1. **Get an API key** from the platform's website\n2. **Save it in Colab Secrets** (🔑 icon on the left) with the exact name shown, and turn on *Notebook access*\n3. **Run the cell**: it reads the key with `userdata.get(...)`, sends a prompt and prints the reply\n\n| Platform | Secret name | Where to get the key | Free? |\n|---|---|---|---|\n| Google Gemini | `GEMINI_API_KEY` | aistudio.google.com/apikey | Yes (free tier) |\n| OpenAI (GPT) | `OPENAI_API_KEY` | platform.openai.com/api-keys | Paid |\n| Anthropic (Claude) | `ANTHROPIC_API_KEY` | console.anthropic.com | Paid (separate from Claude Pro) |\n| Groq (Llama, Qwen…) | `GROQ_API_KEY` | console.groq.com/keys | Yes (free tier) |\n| OpenRouter (300+ models, one key) | `OPENROUTER_API_KEY` | openrouter.ai/keys | Some free models |\n\n**Tip:** model names change often. If you see a *model not found* error, run the \"list models\" line in that section and copy a current name."}, {"t": "code", "s": "# STEP 0: Install the client libraries cleanly to avoid dependency conflicts\n!pip install --force-reinstall -q -U google-genai openai anthropic"}, {"t": "code", "s": "# Import \"userdata\": Colab's tool for reading the secrets you saved under the key icon\nfrom google.colab import userdata\n\n# The question we will send to every AI model.\n# Stored in a variable so we write it once and reuse it everywhere.\nPROMPT = \"Explain what a invoice is in one sentence.\"\nprint(PROMPT)"}, {"t": "markdown", "s": "## 1. Google Gemini"}, {"t": "code", "s": "# Import Google's Gen AI library (the code that knows how to talk to Gemini)\nfrom google import genai\n# Import \"types\": ready-made settings boxes, e.g. for temperature\nfrom google.genai import types\n\n# Create a \"client\": a connection to Google, logged in with your key.\ngemini = genai.Client(api_key=userdata.get(\"GEMINI_API_KEY\"))\n\n# Send the request to Gemini and wait for the answer\nresp = gemini.models.generate_content(\n    model=\"gemini-3.8-flash\",   # Fixed: Using a valid, current Gemini model\n    contents=PROMPT,\n    config=types.GenerateContentConfig(temperature=0.7),\n)\n\nprint(resp.text)"}, {"t": "code", "s": "!pip install -q --force-reinstall --no-deps openai"}, {"t": "markdown", "s": "## 2. OpenAI (GPT)"}, {"t": "code", "s": "# Import OpenAI's library\nfrom openai import OpenAI\n\n# Create the connection, logged in with your OpenAI key from Colab Secrets\nopenai_client = OpenAI(api_key=userdata.get(\"OPENAI_API_KEY\"))\n\n# Fixed: Changed from non-existent gpt-5-mini to a current model\nOPENAI_MODEL = \"gpt-6.1-sol\"\n\n# Send a chat request\nresp = openai_client.chat.completions.create(\n    model=OPENAI_MODEL,\n    messages=[{\"role\": \"user\", \"content\": PROMPT}],\n)\n\nprint(resp.choices[0].message.content)"}, {"t": "markdown", "s": "## 3. Anthropic (Claude)\nNote: this needs an API key from console.anthropic.com. A Claude Pro/Max chat subscription does not include API credits."}, {"t": "code", "s": "# Import Anthropic's library (the code that knows how to talk to Claude)\nimport anthropic\n\n# Create the connection, logged in with your Anthropic key from Colab Secrets\nclaude = anthropic.Anthropic(api_key=userdata.get(\"ANTHROPIC_API_KEY\"))\n\n# Send the message to Claude\nresp = claude.messages.create(\n    model=\"claude-sonnet-5-5\",   # which Claude model to use\n    max_tokens=500,              # REQUIRED for Claude: the maximum length of the answer (~1 token = 3/4 of a word)\n    ##temperature=0.7,             # creativity setting, same idea as before\n    messages=[{\"role\": \"user\", \"content\": PROMPT}],   # same message format as OpenAI\n)\n\n# Claude's answer is a list of \"content blocks\"; [0].text = the text of the first block\nprint(resp.content[0].text)\n\n# OPTIONAL: remove the \"#\" below to list the Claude models available to you\n# for m in claude.models.list(): print(m.id)"}, {"t": "markdown", "s": "## 4. Groq (open-source models, very fast, free tier)\nGroq speaks the **same format as OpenAI**, so you reuse the OpenAI library and only change `base_url`."}, {"t": "code", "s": "# We reuse OpenAI's library, because Groq accepts the same request format\nfrom openai import OpenAI\n\n# Create the connection, but pointed at Groq's servers\ngroq = OpenAI(\n    api_key=userdata.get(\"GROQ_API_KEY\"),        # your Groq key from Colab Secrets\n    base_url=\"https://api.groq.com/openai/v1\",   # the KEY change: send requests to Groq, not OpenAI\n)\n\n# Print every model Groq currently offers, so you can copy a valid name into the next cell\nfor m in groq.models.list():   # loop through each model in the list\n    print(m.id)                # print its name (id)"}, {"t": "code", "s": "# Which model to run on Groq. If you get \"model not found\", copy a name printed by the cell above.\nGROQ_MODEL = \"openai/gpt-oss-120b\"\n\n# Exactly the same call as OpenAI, because Groq is OpenAI-compatible\nresp = groq.chat.completions.create(\n    model=GROQ_MODEL,                                  # which model\n    messages=[{\"role\": \"user\", \"content\": PROMPT}],    # what we ask\n    temperature=0.7,                                   # how creative\n)\n\n# Pull out the answer text (same path as OpenAI)\nprint(resp.choices[0].message.content)"}, {"t": "code", "s": "from google.colab import userdata\nimport os\n\ntry:\n    key = userdata.get('OPENROUTER_API_KEY')\n    if not key:\n        print(\"❌ 'OPENROUTER_API_KEY' is empty or not set in Colab Secrets.\")\n    else:\n        print(\"✅ 'OPENROUTER_API_KEY' found in Secrets!\")\n        # Let's check if the key is structurally valid (typically starts with sk-or-)\n        if key.startswith(\"sk-or-\"):\n            print(\"✅ Key format looks correct (starts with 'sk-or-').\")\n        else:\n            print(\"⚠️ Warning: OpenRouter keys usually start with 'sk-or-'. Please double check your key.\")\nexcept Exception as e:\n    print(f\"❌ Error accessing secret: {e}\")\n    print(\"Please click the 🔑 icon in the left sidebar, add a secret named 'OPENROUTER_API_KEY', and turn on 'Notebook access'.\")"}, {"t": "markdown", "s": "## 6. One function for every platform\nMany platforms accept the OpenAI format, so one helper can call them all. Add a platform by adding one line to `PLATFORMS`."}, {"t": "code", "s": "from openai import OpenAI\n\n# A \"dictionary\" (lookup table): platform name -> (its secret name, its server address)\n# base_url = None means \"use OpenAI's default address\"\nPLATFORMS = {\n    # name:       (secret name,          base_url)\n    \"openai\":     (\"OPENAI_API_KEY\",     None),\n    \"groq\":       (\"GROQ_API_KEY\",       \"https://api.groq.com/openai/v1\"),\n    #\"openrouter\": (\"OPENROUTER_API_KEY\", \"https://openrouter.ai/api/v1\"),\n    \"gemini\":     (\"GEMINI_API_KEY\",     \"https://generativelanguage.googleapis.com/v1beta/openai/\"),  # Gemini's OpenAI-compatible address\n}\n\n# \"def\" defines a reusable function, a mini-machine you can call again and again.\n# Inputs: which platform, which model, the question, and temperature (0.7 if you don't give one)\ndef ask(platform, model, prompt, temperature=0.7):\n    # Look up this platform's secret name and address in the table above\n    secret, base_url = PLATFORMS[platform]\n    # Connect to that platform with its key\n    client = OpenAI(api_key=userdata.get(secret), base_url=base_url)\n    # Send the question\n    r = client.chat.completions.create(\n        model=model,\n        messages=[{\"role\": \"user\", \"content\": prompt}],\n        temperature=temperature,\n    )\n    # Hand the answer text back to whoever called ask()\n    return r.choices[0].message.content\n\n# Try it: ask Gemini through the shared function\n#print(ask(\"gemini\", \"gemini-flash-latest\", PROMPT))\n# Switching platform takes one word, e.g.:\nprint(ask(\"groq\", \"openai/gpt-oss-120b\", PROMPT))"}, {"t": "markdown", "s": "## 7. Experiment: see temperature in action\nSame prompt, run 3 times at low vs high temperature. Low → nearly identical answers. High → more varied."}, {"t": "code", "s": "# A creative question, where answers can vary a lot\nq = \"Give me a catchy name for a procurement analytics startup. Reply with the name only.\"\n\n# Try two temperatures: 0.0 (safe) and 1.5 (adventurous)\nfor t in [0.0, 1.5]:\n    print(f\"\\n--- temperature = {t} ---\")\n    # Ask the same question 3 times at this temperature\n    for i in range(3):\n        resp = groq.chat.completions.create(\n            model=\"openai/gpt-oss-20b\",                   # a chat model from your Groq list\n            messages=[{\"role\": \"user\", \"content\": q}],    # the question\n            temperature=t,                                # the setting we're testing\n        )\n        print(resp.choices[0].message.content.strip())\n\n# Expected: at 0.0 the names barely change; at 1.5 they vary a lot"}, {"t": "code", "s": "# Two prompt styles: one asks for consistency, one asks for creativity\nprompts = {\n    \"SAFE (like low temperature)\":\n        \"Give me the most obvious, conventional name for a procurement analytics startup. Reply with the name only.\",\n    \"CREATIVE (like high temperature)\":\n        \"Give me a bold, unusual, surprising name for a procurement analytics startup. Avoid common words like 'procure' or 'spend'. Reply with the name only.\",\n}\n\nfor label, p in prompts.items():\n    print(f\"\\n--- {label} ---\")\n    for i in range(3):                       # ask 3 times to see how much it varies\n        resp = claude.messages.create(\n            model=\"claude-sonnet-5-5\",\n            max_tokens=50,                   # a short answer is enough\n            messages=[{\"role\": \"user\", \"content\": p}],\n        )\n        print(resp.content[0].text.strip())"}, {"t": "code", "s": "# Save the  \"CREATIVE (like high temperature)\":\n        \"Give me a bold, unusual, surprising name for a procurement analytics startup. Avoid common words like 'procure' or 'spend'. Reply with the name only.\",\n}\n\n# Loop through the table: .items() gives each pair -> label gets the heading, p gets the prompt text\nfor label, p in prompts.items():\n    # Print the heading for this round, with a blank line before it\n    print(f\"\\n--- {label} ---\")\n\n    # Ask each prompt 3 times to see how much the answers vary\n    for i in range(3):\n        # Send the request to Claude and store the reply in \"resp\"\n        resp = claude.messages.create(\n            model=\"claude-sonnet-5-5\",                    # which Claude model to use\n            max_tokens=50,                                # required by Claude: max answer length (~35 words, keeps it short and cheap)\n            messages=[{\"role\": \"user\", \"content\": p}],    # send the current prompt p as your message\n            # no temperature here: Claude's API removed it\n        )                                                 # close the request\n\n        # Print Claude's answer\n        # content[0] = the first block of the reply, .text = its text, .strip() = remove extra spaces\n        print(resp.content[0].text.strip())\n\n# Groq: same prompt, temperature changes -> different variety\n# Claude: same settings, prompt wording changes -> different variety"}, {"t": "markdown", "s": "## Common errors\n| Error | Meaning | Fix |\n|---|---|---|\n| `SecretNotFoundError` | Secret name doesn't match, or notebook access is off | Check the spelling in 🔑 and turn on the toggle |\n| `401 / invalid api key` | Wrong or expired key | Create a new key and paste it again |\n| `404 / model not found` | Model name retired or misspelled | Run the list-models line and pick a current name |\n| `429 / rate limit / quota` | Free-tier limit reached, or no credits | Wait a minute, or add billing |"}] },

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get("fieldnotes-done", {});
let current = SESSIONS.find(s => "#" + s.id === location.hash) || SESSIONS[0];
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderTabs(){
  $("#tabs").innerHTML = SESSIONS.map(s =>
    `<button class="tab" role="tab" aria-selected="${s === current}" data-id="${s.id}">${esc(s.label)}</button>`
  ).join("") + `<span class="tab add" aria-hidden="true">+ next topic</span>`;
  $("#tabs").querySelectorAll("[data-id]").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
}

function progress(){
  const n = current.lessons.length;
  const c = current.lessons.filter((_, i) => done[current.id + ":" + i]).length;
  $("#pcount").textContent = c; $("#ptotal").textContent = n;
  $("#pbar").style.width = (n ? c / n * 100 : 0) + "%";
}

  renderTabs();
  $("#lede").textContent = current.intro;

    <button class="linkbtn" id="expandAll">Expand all</button></div>`;

        ${l.body.map(p => `<p>${p}</p>`).join("")}

        ${(l.after || []).map(p => `<p>${p}</p>`).join("")}
        <button class="done-toggle" data-key="${key}">${isDone ? "✓ Understood" : "Mark as understood"}</button>

    <div class="pm-grid">${s.pm.map(([t, d]) => `<div class="pm"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}</div>
    ${s.pmDiagrams ? `<div class="pm-dgs">${s.pmDiagrams.map(diagram).join("")}</div>` : ""}</div>`;

  h += `<div class="next" style="margin-top:20px"><span class="eyebrow">Next step</span><p>${esc(s.next)}</p>

  if (s.notebook) h += notebookView(s.notebook);

  $("#main").innerHTML = h;
  document.querySelectorAll(".nb-copy").forEach(b => b.onclick = async () => {
    const pre = b.closest(".nb-cell").querySelector("pre");
    try { await navigator.clipboard.writeText(pre.textContent); b.textContent = "Copied"; }
    catch(e){ const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Selected, press Ctrl+C"; }
    setTimeout(() => b.textContent = "Copy", 1800);
  });
  const nbt = $("#nbToggle");
  if (nbt) nbt.onclick = () => { const body = $("#nbBody"); body.hidden = !body.hidden;
    nbt.setAttribute("aria-expanded", !body.hidden); nbt.textContent = body.hidden ? "Show notebook" : "Hide notebook"; };
  bind();
  progress();
}

/* tiny markdown renderer for notebook text cells: headings, tables, lists, bold, inline code */
function md(src){
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  const lines = src.split("\n"), out = []; let i = 0;
  while (i < lines.length){
    const l = lines[i];
    if (/^#{1,6} /.test(l)){ const n = l.match(/^#+/)[0].length; out.push(`<p class="nb-h nb-h${n}">${inline(l.replace(/^#+ /, ""))}</p>`); i++; }
    else if (l.trim().startsWith("|")){
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((_, k) => k !== 1);
      out.push(`<div class="tbl"><table><thead><tr>${cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    else if (/^\d+\. /.test(l)){ const it = []; while (i < lines.length && /^\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\d+\. /, "")); out.push(`<ol>${it.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`); }
    else if (l.trim()){ out.push(`<p>${inline(l)}</p>`); i++; }
    else i++;
  }
  return out.join("");
}

function notebookView(nb){
  let n = 0;
  const cells = nb.cells.map(c => c.t === "markdown"
    ? `<div class="nb-cell nb-md">${md(c.s)}</div>`
    : `<div class="nb-cell"><div class="nb-bar"><span class="mono">In [${++n}]</span><button class="nb-copy">Copy</button></div><pre>${esc(c.s)}</pre></div>`).join("");
  return `<div class="section nb" style="margin-top:20px">
    <div class="toolbar"><div><span class="eyebrow">Reference notebook</span><h2>${esc(nb.file)}</h2></div>
      <button class="linkbtn" id="nbToggle" aria-expanded="false" aria-controls="nbBody">Show notebook</button></div>
    <p class="dg-cap">The Colab notebook used in this topic, cell by cell. Code is shown without outputs; copy any cell into Colab to run it.</p>
    <div id="nbBody" class="nb-body" hidden>${cells}</div></div>`;
}

const arrow = `<div class="dg-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>`;
function diagram(d){
  const cols = d.cols.map(col => `<div class="dg-col">${col.map(n =>
    `<div class="node ${n.k || ""}">${esc(n.t)}${n.s ? `<small>${esc(n.s)}</small>` : ""}</div>`).join("")}</div>`).join(arrow);
  return `<figure class="dg-wrap" style="margin:0"><span class="eyebrow">Diagram · ${esc(d.label)}</span>
    <div class="dg${d.v ? " v" : ""}" role="img" aria-label="${esc(d.label)}">${cols}</div>
    ${d.caption ? `<figcaption class="dg-cap">${esc(d.caption)}</figcaption>` : ""}</figure>`;
}

function widget(kind, s){

  if (kind === "swap") return `<div class="widget"><span class="eyebrow">Swap the provider, keep the code</span>

    <pre id="swapCode"></pre></div>`;

  if (kind === "tradeoffs") return `<div class="widget"><span class="eyebrow">Pick a side of each trade-off</span>
    <div class="pairs">${[["big","gpt-oss-120b"],["small","gpt-oss-20b"],["free"],["paid"],["fast"],["smart"]]

        <button aria-pressed="true">${a[0]}${a[1]?` <span class="mono">(${a[1]})</span>`:""}</button><span>vs</span>
        <button aria-pressed="false">${b[0]}${b[1]?` <span class="mono">(${b[1]})</span>`:""}</button></div>`).join("")}</div>
    <span class="eyebrow" style="margin-top:4px">Non-chat models in the list</span>
    <div class="tags"><span class="tag">safety filters</span><span class="tag">speech to text</span><span class="tag">text to speech</span></div></div>`;

  if (kind === "temperature") return `<div class="widget"><span class="eyebrow">Drag the temperature</span>
    <div class="temp-row"><span class="mono">temperature</span><input type="range" id="temp" min="0" max="1" step="0.1" value="0.2" aria-label="Temperature"><span class="temp-val" id="tempVal">0.2</span></div>
    <div class="scale"><span>predictability</span><span>creativity</span></div>
    <div class="temp-out" id="tempOut"></div></div>`;

  if (kind === "errors") return `<div class="tbl"><table><thead><tr><th>Error</th><th>Layer</th></tr></thead><tbody>

    all.forEach(a => toggle(a, open)); e.target.textContent = open ? "Collapse all" : "Expand all";
  };
  document.querySelectorAll(".done-toggle").forEach(b => b.onclick = () => {
    const k = b.dataset.key; done[k] = !done[k]; if (!done[k]) delete done[k]; store.set("fieldnotes-done", done);
    b.closest(".lesson").classList.toggle("done", !!done[k]);
    b.textContent = done[k] ? "✓ Understood" : "Mark as understood"; progress();
  });

  // steps
  const notes = ["your key proves who you are", "pick which model answers", "send text", "get text back"];
  document.querySelectorAll(".step").forEach(b => b.onclick = () => {
    document.querySelectorAll(".step").forEach(x => x.classList.toggle("on", x === b));
    $("#flowNote").textContent = `step ${+b.dataset.step + 1} of 4 · ${notes[b.dataset.step]}`;
  });

  // swap
  const code = p => `client = OpenAI(\n    api_key=...,\n    <span class="hl">base_url="&lt;${p} base_url&gt;"</span>,\n)\nask("Hello")   <span style="color:var(--muted)"># same function, different provider</span>`;
  if ($("#swapCode")) $("#swapCode").innerHTML = code("Groq");
  document.querySelectorAll("[data-prov]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-prov]").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("#swapCode").innerHTML = code(b.dataset.prov);
  });

  // tradeoffs
  document.querySelectorAll(".pair").forEach(r => r.querySelectorAll("button").forEach(b => b.onclick = () =>
    r.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b))));

  // temperature
  const t = $("#temp");
  if (t){ const upd = () => { const v = +t.value; $("#tempVal").textContent = v.toFixed(1);
      $("#tempOut").textContent = v <= 0.3 ? "Low: suits extraction or contract checks."
        : v >= 0.7 ? "Higher: suits brainstorming." : "Middle: trading predictability for creativity."; };
    t.oninput = upd; upd(); }

  if ($("#quiz")) quiz(current.errors);
}

function toggle(el, force){
  const open = force === undefined ? !el.classList.contains("open") : force;
  el.classList.toggle("open", open);
  el.querySelector(".lesson-head").setAttribute("aria-expanded", open);
  el.querySelector(".lesson-body").hidden = !open;
}

function quiz(errors){
  const layers = errors.map(e => e[1]);
  let order = errors.map((_, i) => i).sort(() => Math.random() - .5), pos = 0, score = 0, answered = 0;
  const show = () => {
    const [err, layer] = errors[order[pos]];
    $("#qq").textContent = err; $("#qn").disabled = true;
    $("#qo").innerHTML = layers.map(l => `<button>${esc(l)}</button>`).join("");
    $("#qo").querySelectorAll("button").forEach(b => b.onclick = () => {
      if (!$("#qn").disabled) return;
      answered++; if (b.textContent === layer) score++;
      $("#qo").querySelectorAll("button").forEach(x => {
        if (x.textContent === layer) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
      $("#qs").textContent = score; $("#qt").textContent = answered;
      $("#qn").disabled = false; $("#qn").textContent = pos === errors.length - 1 ? "Start again" : "Next error";
    });
  };
  $("#qn").onclick = () => { pos++; if (pos >= errors.length){ pos = 0; score = 0; answered = 0;
      order.sort(() => Math.random() - .5); $("#qs").textContent = 0; $("#qt").textContent = 0; } show(); };
  show();
}

window.addEventListener("hashchange", () => { current = SESSIONS.find(s => "#" + s.id === location.hash) || SESSIONS[0]; render(); });
render();
toggle(document.querySelector(".lesson"), true);
</script>
