<title>AI Engineering Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook column; session switcher on top, numbered lessons as expandable entries, PM mapping and next step below. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eceef3; --fg:#171a21; --muted:#5b6170;
  --line:#d9dce4; --accent:#3a4fd6; --accent-soft:#e3e7fb; --accent-fg:#ffffff;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --bad:#c2410c; --bad-soft:#fde7dc;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1a1d25; --sunk:#232733; --fg:#e8eaf0; --muted:#9aa0b0;
  --line:#2e3341; --accent:#8b9bff; --accent-soft:#262c4d; --accent-fg:#10121a;
  --ok:#4fd19a; --ok-soft:#173a2b; --bad:#ff9a6b; --bad-soft:#3d2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1a1d25; --sunk:#232733; --fg:#e8eaf0; --muted:#9aa0b0;
  --line:#2e3341; --accent:#8b9bff; --accent-soft:#262c4d; --accent-fg:#10121a;
  --ok:#4fd19a; --ok-soft:#173a2b; --bad:#ff9a6b; --bad-soft:#3d2219; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.sheet{background:var(--bg);border-radius:14px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.eyebrow{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--sunk);padding:1px 6px;border-radius:5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:14px;background:var(--bg);padding:8px 0}
.lede{color:var(--muted);max-width:62ch}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab.add{border-style:dashed;color:var(--muted);cursor:default}

.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.progress b{font-variant-numeric:tabular-nums;color:var(--fg)}

.section{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--accent);font-size:14px;padding:4px 0}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lesson.done{border-color:var(--ok)}
.lesson-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;width:100%;
  text-align:left;background:none;border:none;padding:16px 18px}
.num{font:600 14px/1 var(--mono);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.lesson.done .num{background:var(--ok-soft);color:var(--ok)}
.lesson-head h3{padding-top:3px}
.chev{width:22px;height:22px;margin-top:4px;color:var(--muted);transition:transform .2s}
.lesson.open .chev{transform:rotate(180deg)}
.lesson-body{padding:0 18px 18px 62px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lesson-body p{max-width:66ch}
.done-toggle{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:14px;
  border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:8px}
.lesson.done .done-toggle{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

.widget{background:var(--sunk);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.widget .eyebrow{font-size:11px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;
  display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.step small{font:500 11px var(--mono);color:var(--muted)}
.step.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.flow-note{font:13px var(--mono);color:var(--muted)}

/* swap */
.swap{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font:13px/1.5 var(--mono)}
pre .hl{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}

/* tradeoffs */
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px}
.pair button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pair span{font:12px var(--mono);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:12px var(--mono);padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}

/* temperature */
.temp-row{display:flex;align-items:center;gap:12px}
.temp-row input{flex:1;accent-color:var(--accent)}
.temp-val{font:600 15px var(--mono);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.scale{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.temp-out{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}

/* error table + quiz */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:none}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz-q{font:500 15px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;text-align:left}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);gap:8px;flex-wrap:wrap}
.quiz-foot b{font-variant-numeric:tabular-nums;color:var(--fg)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:default}

/* PM */
.pm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pm h3{font-size:16px}
.pm p{font-size:15px;color:var(--muted)}

.next{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.next .eyebrow{color:var(--accent)}
.fields{display:flex;gap:6px;flex-wrap:wrap}
.fields .tag{background:var(--surface)}

/* block diagrams */
.dg-wrap{background:var(--sunk);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dg-wrap .eyebrow{font-size:11px}
.dg{display:flex;align-items:center;min-width:0}
.dg-col{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0}
.node{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.node small{display:block;font:400 11px/1.35 var(--mono);color:var(--muted);margin-top:3px}
.node.accent{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.node.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.node.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.node.ghost{border-style:dashed;background:transparent;color:var(--muted);font-weight:500}
.node.accent small,.node.ok small,.node.bad small{color:inherit;opacity:.8}
.dg-arrow{flex:0 0 26px;display:grid;place-items:center;color:var(--muted)}
.dg-arrow svg{width:22px;height:22px}
.dg.v{flex-direction:column;align-items:stretch}
.dg.v .dg-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
.dg.v .dg-col .node{flex:1 1 140px}
.dg.v .dg-arrow{flex-basis:24px}
.dg.v .dg-arrow svg{transform:rotate(90deg)}
.dg-cap{font-size:13px;color:var(--muted)}
.pm-dgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){
  .dg{flex-direction:column;align-items:stretch}
  .dg-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .dg-col .node{flex:1 1 130px}
  .dg-arrow{flex-basis:24px}
  .dg-arrow svg{transform:rotate(90deg)}
  .pm-dgs{grid-template-columns:1fr}
}

/* start here: LLM API */
.start{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.api-fig{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:14px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:22px 22px}
.api-cap{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em}
.api-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:0}
.api-box{background:var(--surface);border:2px solid var(--fg);box-shadow:4px 4px 0 var(--fg);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--fg)}
.api-box b{font-size:15px}
.api-box small{font-size:12px;color:var(--muted)}
.api-mid{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 4px;min-width:0}
.api-msg{font:12px var(--mono);background:var(--surface);padding:3px 8px;border:1.5px solid;max-width:100%;overflow-wrap:anywhere;text-align:center}
.api-msg.p{border-color:var(--accent);color:var(--accent)}
.api-msg.r{border-color:var(--ok);color:var(--ok)}
.api-arrow{position:relative;height:2px;width:100%;background:var(--fg)}
.api-arrow::after{content:"";position:absolute;top:-5px;border:6px solid transparent}
.api-arrow.r::after{right:-2px;border-left:9px solid var(--fg);border-right:0}
.api-arrow.l::after{left:-2px;border-right:9px solid var(--fg);border-left:0}
@media (max-width:600px){
  .api-row{grid-template-columns:1fr;gap:10px}
  .api-mid{padding:4px 0}
  .api-arrow{display:none}
  .api-msg.p::before{content:"\2193  "}
  .api-msg.r::before{content:"\2191  "}
}

/* learning concepts */
.tab.concept{border-color:var(--accent);color:var(--accent)}
.tab.concept[aria-selected="true"]{color:var(--accent-fg)}
.subtabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);background:var(--bg)}
.subtab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font:600 15px var(--display);color:var(--muted);margin-bottom:-1px}
.subtab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.concept-body{display:flex;flex-direction:column;gap:22px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:66ch}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fig-cap{font-size:13px;color:var(--muted);max-width:66ch}
.fig-cap b{color:var(--fg)}
.fig-cap small{display:block;font-size:12px;margin-top:2px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.prompt-box{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:18px 16px;font-size:17px;min-height:64px}
.prompt-box mark{background:var(--accent-soft);color:var(--accent);padding:0 4px;border-radius:4px;font-weight:600}
.toks{display:flex;flex-direction:column;gap:6px}
.tok{display:grid;grid-template-columns:92px 1fr 46px;gap:12px;align-items:center;font:13px var(--mono);padding:2px 4px;border-radius:5px}
.tok .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.tok .fill{height:100%;background:var(--muted);opacity:.55;border-radius:99px;transition:width .35s ease}
.tok .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tok.picked{background:var(--accent-soft)}
.tok.picked .fill{background:var(--accent);opacity:1}
.tok.picked .name,.tok.picked .pct{color:var(--accent);font-weight:600}
.controls{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.controls label{font-size:14px;color:var(--muted)}
.controls input[type=range]{flex:1;min-width:140px;accent-color:var(--fg)}
.controls .tv{font:600 14px var(--mono);min-width:3ch;font-variant-numeric:tabular-nums}
.btn.ghost{background:var(--surface);color:var(--accent)}
.hist{display:flex;flex-wrap:wrap;gap:4px;font-size:13px;color:var(--muted);align-items:center;min-height:24px}
.hist .tag.fav{border-color:var(--accent);color:var(--accent)}
.mol{width:100%;height:150px;display:block;background:var(--sunk);border-radius:8px}
.hc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hc div{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
.hc b{display:block;font-family:var(--display);margin-bottom:2px}
.hist3{display:flex;flex-direction:column;gap:0}
.hist3 .row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.hist3 .row:first-child{border-top:none;padding-top:0}
.hist3 .era{font:500 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.hist3 .era small{display:block;color:var(--muted);letter-spacing:0;text-transform:none}
.runs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.runs pre{font-size:12.5px}
.runs h4{margin:0 0 6px;font:600 14px var(--display)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{font-weight:600}
.kv dd{margin:0;color:var(--muted)}
@media (max-width:600px){
  .tok{grid-template-columns:78px 1fr 40px;gap:8px}
  .hc,.runs{grid-template-columns:1fr}
  .hist3 .row{grid-template-columns:1fr;gap:4px}
}

/* json try-it */
.json-try{width:100%;font:13px/1.5 var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:4}
.json-try:focus{outline:2px solid var(--accent);outline-offset:0}
.json-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* cosine demos */
.cos-demo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center}
.cos-demo svg{width:100%;height:auto;background:var(--sunk);border-radius:8px}
.cos-ctrl{display:flex;flex-direction:column;gap:6px;font-size:14px}
.cos-ctrl label{display:flex;justify-content:space-between;color:var(--muted)}
.cos-ctrl label b{color:var(--fg);font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.cos-ctrl input{accent-color:var(--accent)}
.cos-score{margin-top:8px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cos-score span{font-size:13px;color:var(--muted)}
.cos-score b{font:600 26px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.cos-score small{font-size:13px;color:var(--accent)}
.cos-q{display:flex;flex-wrap:wrap;gap:6px}
.cos-k{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.cos-k input{flex:0 1 200px;accent-color:var(--accent)}
.cos-k b{font:600 14px var(--mono);color:var(--fg)}
.cos-results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cos-results li{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(60px,1fr) 44px 64px;gap:10px;align-items:center;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cos-results li.hit{border-color:var(--ok);background:var(--ok-soft)}
.cr-bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.cr-bar i{display:block;height:100%;background:var(--muted);border-radius:99px;transition:width .3s}
.cos-results li.hit .cr-bar i{background:var(--ok)}
.cos-results b{font:600 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.cr-tag{font:600 10px var(--mono);text-transform:uppercase;color:var(--ok);text-align:right}
@media (max-width:640px){
  .cos-demo{grid-template-columns:1fr}
  .cos-results li{grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px}
  .cr-bar{grid-column:1/-1;grid-row:2}
  .cr-tag{grid-column:1/-1;text-align:left}
}

/* rag approaches */
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.way{background:var(--surface);border:2px solid var(--fg);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.way.w1{box-shadow:5px 5px 0 #e8a23a}
.way.w2{box-shadow:5px 5px 0 var(--accent)}
.way-n{font:700 15px var(--display)}
.way p{font-size:14px;color:var(--muted)}
.way ul{margin:4px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.rag-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.rag-step{border:1px solid var(--line);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0;font-size:13px}
.rag-step b{font-size:13px}
.rs-n{font:600 11px var(--mono);color:var(--muted)}
.rs-who{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.rag-step small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.rag-step.you{border-color:var(--accent);background:var(--accent-soft)}
.rag-step.you .rs-who{color:var(--accent)}
.rag-step.p{border-color:var(--ok);background:var(--ok-soft)}
.rag-step.p .rs-who{color:var(--ok)}
.rag-step.skip{border-style:dashed;opacity:.6}

function paraHtml(p){
  if (p.startsWith("<ul") || p.startsWith("<div") || p.startsWith("<a ")) return p.startsWith("<a ") ? `<p>${p}</p>` : p;
  if (/<(pre|ul|div|table)/.test(p)) return `<div class="pq">${p}</div>`;
  return `<p>${p}</p>`;
}

}

/* ============================================================
   PROJECTS — stored in the page's shared database (db) and file store (assets).
   Collection "projects": {name, summary, createdAt, links:[{title,url,addedAt}], files:[{id,name,type,size,addedAt}]}
   ============================================================ */
const P = { db: null, assets: null, user: null, ready: false, failed: "", list: [], subscribed: false, msgs: {} };
const FILE_TYPES = { pdf:"application/pdf", png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif", webp:"image/webp",
  svg:"image/svg+xml", mp4:"video/mp4", webm:"video/webm", csv:"text/csv", md:"text/markdown", json:"application/json", txt:"text/plain" };
const ACCEPT = Object.keys(FILE_TYPES).map(e => "." + e).join(",");
const fmtSize = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(0) + " KB" : (b / 1048576).toFixed(1) + " MB";
const fmtDate = t => { try { return new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); } catch(e){ return ""; } };
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch(e){ return ""; } };
const UPLOAD_ERR = { too_large: "That file is over 20 MB. Compress it or split it, then try again.",
  unsupported_type: "That file type can't be attached. Use PDF, an image, a video (MP4/WebM), or a text, Markdown, CSV or JSON file.",
  quota_or_state: "This page's storage is full. Remove an attachment you no longer need, then try again.",
  rate_limited: "Too many uploads at once. Wait a moment, then try again.",
  not_granted: "Uploading needs edit access to this page.", upstream_auth: "Your session expired. Reload the page and sign in again." };

async function initProjects(){
  if (P.subscribed) return; P.subscribed = true;
  let timer = setTimeout(() => { if (!P.ready){ P.failed = "Projects didn't load. Reload the page to try again."; if (view === "projects") renderProjects(); } }, 10000);
  try { P.db = await claude.use("db"); } catch(e){ P.db = null; }
  if (!P.db){ clearTimeout(timer); P.failed = "Projects are saved to your claude.ai account. Open this page signed in to claude.ai to see and add them."; if (view === "projects") renderProjects(); return; }
  claude.use("assets").then(a => { P.assets = a; if (view === "projects") renderProjects(); }).catch(() => {});
  claude.use("user").then(u => { P.user = u; if (view === "projects") renderProjects(); }).catch(() => {});
  P.db.collection("projects").orderBy("createdAt", "desc").onSnapshot(snap => {
    clearTimeout(timer); P.ready = true; P.failed = "";
    P.list = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) }));
    if (view === "projects") renderProjects();
  }, err => { clearTimeout(timer); P.failed = "Projects couldn't load (" + (err && err.code || "error") + "). Reload the page to try again."; if (view === "projects") renderProjects(); });
}

function canWrite(){ const c = P.user && P.user.can ? P.user.can("data.write") : null; return c !== false; }

function renderProjects(){
  $("#lede").textContent = "Document your projects: add links and attach project details.";
  const w = P.db && canWrite();
  let h = `<div class="section"><div><span class="eyebrow">Projects</span><h2>My projects</h2></div>`;
  if (w) h += `<form class="card proj-new" id="newProj">
      <div class="field"><label for="pName">Project name</label><input id="pName" maxlength="120" required placeholder="e.g. Procurement clause extractor"></div>
      <div class="field"><label for="pSummary">Short description (optional)</label><input id="pSummary" maxlength="300" placeholder="What it does, in one line"></div>
      <button class="btn" type="submit">Add project</button>
    </form><p class="msg" id="newMsg" aria-live="polite"></p>`;
  if (P.failed) h += `<div class="empty">${esc(P.failed)}</div>`;
  else if (!P.ready) h += `<div class="empty">Loading projects…</div>`;
  else if (!P.list.length) h += `<div class="empty">No projects yet.${w ? " Add your first one above, then add its links and attach its files." : ""}</div>`;
  else h += P.list.map(pr => projectCard(pr, w)).join("");
  h += `</div>`;
  $("#main").innerHTML = h;
  bindProjects();
}

function projectCard(pr, w){
  const links = Array.isArray(pr.links) ? pr.links : [], files = Array.isArray(pr.files) ? pr.files : [];
  const m = P.msgs[pr.id] || {};
  const linkItems = links.length ? links.map((l, i) => { const u = safeUrl(l.url); return `<li class="item"><span class="ic">link</span>
      <span class="tx">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(l.title || u)}</a>` : `<span>${esc(l.title || "")}</span>`}<small>${esc(u || String(l.url || ""))}</small></span>
      ${w ? `<button class="x" data-act="rmLink" data-p="${esc(pr.id)}" data-i="${i}" aria-label="Remove link">Remove</button>` : ""}</li>`; }).join("")
    : `<li class="empty-row">No links yet.</li>`;
  const fileItems = files.length ? files.map((f, i) => { const ext = (String(f.name || "").split(".").pop() || "file").slice(0, 4);
      return `<li class="item"><span class="ic">${esc(ext)}</span>
      <span class="tx"><a href="/_blob/${encodeURIComponent(f.id || "")}" target="_blank" rel="noopener">${esc(f.name || "Attachment")}</a><small>${fmtSize(+f.size || 0)} · added ${esc(fmtDate(f.addedAt))}</small></span>
      ${w && P.assets ? `<button class="x" data-act="rmFile" data-p="${esc(pr.id)}" data-i="${i}" aria-label="Remove attachment">Remove</button>` : ""}</li>`; }).join("")
    : `<li class="empty-row">No attachments yet.</li>`;
  return `<article class="proj" data-id="${esc(pr.id)}">
    <div class="proj-top"><div><h3>${esc(pr.name || "Untitled project")}</h3>${pr.summary ? `<p>${esc(pr.summary)}</p>` : ""}<span class="proj-date">Added ${esc(fmtDate(pr.createdAt))}</span></div>
      ${w ? `<button class="x" data-act="rmProj" data-p="${esc(pr.id)}">Delete project</button>` : ""}</div>
    <div class="proj-cols">
      <div class="pane"><h4>Links <span>${links.length}</span></h4><ul class="items">${linkItems}</ul>
        ${w ? `<form class="mini-form" data-act="addLink" data-p="${esc(pr.id)}">
          <label class="sr" for="lt-${esc(pr.id)}">Link title</label><input id="lt-${esc(pr.id)}" name="title" maxlength="120" placeholder="Title (e.g. Demo, GitHub repo)">
          <label class="sr" for="lu-${esc(pr.id)}">Link URL</label><input id="lu-${esc(pr.id)}" name="url" maxlength="2000" placeholder="https://…" required>
          <button class="btn" type="submit">Add link</button></form>` : ""}
        <p class="msg ${m.linkErr ? "err" : ""}" aria-live="polite">${esc(m.link || "")}</p></div>
      <div class="pane"><h4>Attachments <span>${files.length}</span></h4><ul class="items">${fileItems}</ul>
        ${w && P.assets ? `<label class="drop" data-drop="${esc(pr.id)}"><input type="file" class="sr" accept="${ACCEPT}" multiple data-file="${esc(pr.id)}">
          <b>Choose files</b> or drop them here<br><small>PDF, images, MP4/WebM, text, Markdown, CSV, JSON · up to 20 MB each</small></label>`
          : w ? `<p class="msg">Attaching files needs edit access to this page.</p>` : ""}
        <p class="msg ${m.fileErr ? "err" : m.fileOk ? "ok" : ""}" aria-live="polite">${esc(m.file || "")}</p></div>
    </div></article>`;
}

function setMsg(id, patch){ P.msgs[id] = { ...(P.msgs[id] || {}), ...patch }; }
const projDoc = id => P.db.collection("projects").doc(id);
const findProj = id => P.list.find(p => p.id === id);

function bindProjects(){
  const nf = $("#newProj");
  if (nf) nf.onsubmit = async e => { e.preventDefault();
    const name = $("#pName").value.trim(), summary = $("#pSummary").value.trim();
    if (!name){ $("#newMsg").textContent = "Give the project a name."; return; }
    nf.querySelector("button").disabled = true;
    try { await P.db.collection("projects").add({ name, summary, createdAt: new Date().toISOString(), links: [], files: [] }); }
    catch(err){ $("#newMsg").textContent = "Couldn't add the project (" + (err && err.code || "error") + "). Try again."; nf.querySelector("button").disabled = false; }
  };
  document.querySelectorAll('form[data-act="addLink"]').forEach(f => f.onsubmit = async e => { e.preventDefault();
    const id = f.dataset.p, pr = findProj(id); if (!pr) return;
    let url = f.url.value.trim(); if (url && !/^[a-z]+:\/\//i.test(url)) url = "https://" + url;
    if (!safeUrl(url)){ setMsg(id, { link: "Enter a web address starting with http:// or https://.", linkErr: true }); return renderProjects(); }
    const links = (pr.links || []).concat({ title: f.title.value.trim() || new URL(url).hostname, url: safeUrl(url), addedAt: new Date().toISOString() });
    setMsg(id, { link: "", linkErr: false });
    try { await projDoc(id).update({ links }); } catch(err){ setMsg(id, { link: "Couldn't save the link (" + (err && err.code || "error") + ").", linkErr: true }); renderProjects(); }
  });
  document.querySelectorAll("[data-file]").forEach(inp => inp.onchange = () => { uploadFiles(inp.dataset.file, [...inp.files]); inp.value = ""; });
  document.querySelectorAll("[data-drop]").forEach(d => {
    d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); uploadFiles(d.dataset.drop, [...e.dataTransfer.files]); };
  });
  document.querySelectorAll("button.x[data-act]").forEach(b => b.onclick = async () => {
    if (!b.classList.contains("confirm")){ b.classList.add("confirm"); b.dataset.label = b.textContent; b.textContent = "Click again to confirm";
      setTimeout(() => { if (b.isConnected){ b.classList.remove("confirm"); b.textContent = b.dataset.label; } }, 4000); return; }
    const id = b.dataset.p, pr = findProj(id); if (!pr) return; b.disabled = true;
    try {
      if (b.dataset.act === "rmLink") await projDoc(id).update({ links: (pr.links || []).filter((_, i) => i !== +b.dataset.i) });
      if (b.dataset.act === "rmFile"){ const f = (pr.files || [])[+b.dataset.i];
        await projDoc(id).update({ files: (pr.files || []).filter((_, i) => i !== +b.dataset.i) });
        if (f && f.id && P.assets) await P.assets.delete(f.id).catch(() => {}); }
      if (b.dataset.act === "rmProj"){ await projDoc(id).delete();
        if (P.assets) for (const f of pr.files || []) if (f.id) await P.assets.delete(f.id).catch(() => {}); }
    } catch(err){ b.disabled = false; b.textContent = "Couldn't remove (" + (err && err.code || "error") + ")"; }
  });

let uploading = false;
async function uploadFiles(id, files){
  if (!files.length || !P.assets) return;
  if (uploading){ setMsg(id, { file: "An upload is already running. Wait for it to finish.", fileErr: true }); return renderProjects(); }
  uploading = true;
  let added = [], errs = [];
  for (const f of files){
    const ext = (f.name.split(".").pop() || "").toLowerCase(), type = FILE_TYPES[ext];
    if (!type){ errs.push(f.name + ": " + UPLOAD_ERR.unsupported_type); continue; }
    setMsg(id, { file: "Uploading " + f.name + "…", fileErr: false, fileOk: false }); renderProjects();
    try { const r = await P.assets.upload(f, { type });
      added.push({ id: r.id, name: f.name, type: r.contentType, size: r.sizeBytes, addedAt: new Date().toISOString() }); }
    catch(err){ errs.push(f.name + ": " + (UPLOAD_ERR[err && err.code] || "Upload failed. Try again.")); }
  }
  if (added.length){ const pr = findProj(id);
    try { await projDoc(id).update({ files: ((pr && pr.files) || []).concat(added) }); }
    catch(err){ errs.push("Saved the files but couldn't list them (" + (err && err.code || "error") + ")."); } }
  uploading = false;
  setMsg(id, errs.length ? { file: errs.join(" "), fileErr: true, fileOk: false }
    : { file: "Attached " + added.length + " file" + (added.length === 1 ? "" : "s") + ".", fileErr: false, fileOk: true });
  renderProjects();
}

  };

/* molecule canvas: speed follows the temperature slider */
let molT = 0.9, molRaf = 0;
function stopMolecules(){ cancelAnimationFrame(molRaf); molRaf = 0; }
function startMolecules(){
  const c = $("#mol"); if (!c) return;
  const ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const size = () => { c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; };
  size();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pts = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random(), a: Math.random() * Math.PI * 2 }));
  const frame = () => {
    if (!document.body.contains(c)) return;
    if (c.width !== c.clientWidth * dpr) size();
    const cs = getComputedStyle(document.documentElement);
    const W = c.width, H = c.height, sp = 0.0006 + molT * 0.0045;
    ctx.clearRect(0, 0, W, H);
    pts.forEach(p => {
      if (!still){
        p.a += (Math.random() - .5) * 0.4 * molT;
        p.x += Math.cos(p.a) * sp * (H / W); p.y += Math.sin(p.a) * sp;
        if (molT < 0.05) p.y += 0.004;
        if (p.x < 0.02 || p.x > 0.98){ p.a = Math.PI - p.a; p.x = Math.min(.98, Math.max(.02, p.x)); }
        if (p.y < 0.05 || p.y > 0.95){ p.a = -p.a; p.y = Math.min(.95, Math.max(.05, p.y)); }
      }
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 4.5 * dpr, 0, Math.PI * 2);
      ctx.fillStyle = molT > 1 ? cs.getPropertyValue("--bad") : cs.getPropertyValue("--accent"); ctx.fill();
    });
    if (!still) molRaf = requestAnimationFrame(frame);
  };
  frame();
}

function cosineView(){
  return `

    <div class="prose"><ul>
      <li><b>1. Turn text into numbers (embeddings).</b> An embedding model converts each piece of text into a long list of numbers, called a vector. Texts with similar meaning get vectors that point in a similar direction.</li>
      <li><b>2. Measure the angle between two vectors.</b> Cosine similarity compares direction, not length: <b>1</b> means the same direction (very similar meaning), <b>0</b> means unrelated, <b>−1</b> means opposite. With text embeddings, scores usually fall between 0 and 1.</li>
      <li><b>3. Search.</b> Embed the user's question, compare it with every stored vector, and return the top few matches (the "top-k").</li>
    </ul></div>

  </div>

    </div>
  </div>

    <h3>Try it: a mini semantic search</h3>

def cosine(a, b):
    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))

query   = np.array([0.9, 0.1, 0.0])   # &quot;late payment penalty&quot;

clause2 = np.array([0.0, 0.1, 0.9])   # &quot;goods shipped by sea freight&quot;

  </div>

    <div class="prose"><ul>

  <div class="card">
    <h3>Starter code</h3>
    <p class="fig-cap">Both use a sample file named <code>supplier_contract.pdf</code>; upload your own to Colab and change the name. I checked both against the current libraries; the LangGraph one ran end to end with a stand-in model.</p>
    <details class="code-det" open><summary>Way 1 · Gemini File Search (about 20 lines)</summary><div class="code-block"><div class="nb-bar"><span class="mono">python</span><button class="nb-copy code-copy">Copy</button></div><pre># pip install -q -U google-genai
import time
from google import genai
from google.genai import types
from google.colab import userdata

client = genai.Client(api_key=userdata.get(&quot;GEMINI_API_KEY&quot;))

# 1. Create a store and upload a file (Gemini chunks, embeds and indexes it)
store = client.file_search_stores.create(config={&quot;display_name&quot;: &quot;supplier-contracts&quot;})
op = client.file_search_stores.upload_to_file_search_store(
    file=&quot;supplier_contract.pdf&quot;,
    file_search_store_name=store.name,
    config={&quot;display_name&quot;: &quot;supplier_contract&quot;},
)
while not op.done:                 # indexing runs in the background
    time.sleep(5)
    op = client.operations.get(op)

# 2. Ask questions: Gemini searches the store, then answers
response = client.models.generate_content(
    model=&quot;gemini-3.8-flash&quot;,
    contents=&quot;What is the late payment penalty?&quot;,
    config=types.GenerateContentConfig(
        tools=[types.Tool(file_search=types.FileSearch(file_search_store_names=[store.name]))]
    ),
)
print(response.text)
print(response.candidates[0].grounding_metadata.grounding_chunks)   # which parts of the file it used</pre></div></details>
    <details class="code-det"><summary>Way 2 · LangChain + LangGraph (about 40 lines)</summary><div class="code-block"><div class="nb-bar"><span class="mono">python</span><button class="nb-copy code-copy">Copy</button></div><pre># pip install -q langgraph langchain-core langchain-text-splitters langchain-google-genai pypdf
import os
from typing import TypedDict
from google.colab import userdata
from pypdf import PdfReader
from langchain_text_splitters import RecursiveCharacterTextSplitter
from langchain_core.vectorstores import InMemoryVectorStore
from langchain_google_genai import GoogleGenerativeAIEmbeddings, ChatGoogleGenerativeAI
from langgraph.graph import StateGraph, START, END

os.environ[&quot;GOOGLE_API_KEY&quot;] = userdata.get(&quot;GEMINI_API_KEY&quot;)

# 1. Load and chunk
text = &quot;\n&quot;.join(page.extract_text() for page in PdfReader(&quot;supplier_contract.pdf&quot;).pages)
chunks = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=150).create_documents([text])

# 2. Embed and store
store = InMemoryVectorStore.from_documents(chunks, GoogleGenerativeAIEmbeddings(model=&quot;gemini-embedding-001&quot;))
llm = ChatGoogleGenerativeAI(model=&quot;gemini-3.8-flash&quot;)

# 3. The graph: retrieve -&gt; generate
class State(TypedDict):
    question: str
    context: list
    answer: str

def retrieve(state: State):
    return {&quot;context&quot;: store.similarity_search(state[&quot;question&quot;], k=4)}   # cosine similarity search

def generate(state: State):
    context = &quot;\n\n&quot;.join(doc.page_content for doc in state[&quot;context&quot;])
    reply = llm.invoke(f&quot;Answer only from this context. If it isn&#x27;t there, say so.\n\n{context}\n\nQuestion: {state[&#x27;question&#x27;]}&quot;)
    return {&quot;answer&quot;: reply.content}

graph = StateGraph(State)
graph.add_node(&quot;retrieve&quot;, retrieve)
graph.add_node(&quot;generate&quot;, generate)
graph.add_edge(START, &quot;retrieve&quot;)
graph.add_edge(&quot;retrieve&quot;, &quot;generate&quot;)
graph.add_edge(&quot;generate&quot;, END)
rag = graph.compile()

print(rag.invoke({&quot;question&quot;: &quot;What is the late payment penalty?&quot;})[&quot;answer&quot;])</pre></div></details>
  </div>

  <div class="card">
    <h3>Other ways</h3>
    <dl class="kv">
      <dt>OpenAI File Search</dt><dd>The same idea as Way 1 on OpenAI: upload files to a vector store, then turn on the <code>file_search</code> tool in the Responses API.</dd>
      <dt>LlamaIndex</dt><dd>A framework like LangChain, focused on indexing and retrieval. A standard RAG pipeline takes very few lines.</dd>
      <dt>DIY</dt><dd>An embedding API plus a vector database (Chroma, pgvector, Pinecone) and your own code, no framework. The most work, and you understand every step: it's the Cosine Similarity demo for real.</dd>
      <dt>Cloud-managed RAG</dt><dd>Vertex AI RAG Engine, Amazon Bedrock Knowledge Bases or Azure AI Search. Managed like Way 1, but inside your company's cloud, with its security and connectors to SharePoint, S3 or Drive.</dd>
      <dt>Long context, no retrieval</dt><dd>Put the whole document in the prompt; Gemini and Claude handle very long inputs. Simplest for a few documents, but every question pays for the full document.</dd>
    </dl>
  </div>

  <div class="card">
    <h3>Compare them</h3>
    <div class="tbl"><table class="cmp"><thead><tr><th>Approach</th><th>Setup effort</th><th>Control</th><th>Where your data lives</th><th>Cost model</th><th>Best for</th></tr></thead><tbody>
      <tr><td><b>Gemini File Search (Way 1)</b></td><td>Very low</td><td>Low: Gemini picks chunking and search; you can set chunk size, top_k and filters</td><td>Google's File Search store</td><td>Pay to index files at upload; storage and query-time embeddings were free at launch</td><td>Prototypes, quick internal Q&amp;A over PDFs</td></tr><tr><td><b>OpenAI File Search</b></td><td>Very low</td><td>Low to medium: chunk size and metadata filters</td><td>OpenAI vector store</td><td>Storage per GB per day, plus a fee per search call</td><td>Teams already building on OpenAI</td></tr><tr><td><b>LangChain + LangGraph (Way 2)</b></td><td>Medium to high</td><td>Full: any model, any vector DB, your own steps; LangGraph adds loops, checks and retries</td><td>Wherever you choose</td><td>Model and vector DB usage only, plus your build time</td><td>Production apps, custom logic, agentic RAG</td></tr><tr><td><b>LlamaIndex</b></td><td>Medium</td><td>High: framework focused on indexing and retrieval</td><td>Wherever you choose</td><td>Model and vector DB usage only</td><td>Document-heavy apps; standard pipelines in few lines</td></tr><tr><td><b>DIY (embeddings + vector DB)</b></td><td>High</td><td>Full: you write every step</td><td>Wherever you choose</td><td>Model and vector DB usage; the most engineering time</td><td>Learning, or very specific needs</td></tr><tr><td><b>Cloud-managed RAG</b></td><td>Medium (cloud setup)</td><td>Medium</td><td>Your company's cloud account</td><td>Cloud service pricing</td><td>Enterprises, compliance, data in SharePoint, S3 or Drive</td></tr><tr><td><b>Long context (no retrieval)</b></td><td>None</td><td>Low</td><td>Sent with every request</td><td>You pay for the whole document on every question</td><td>1–3 documents, quick checks</td></tr>
    </tbody></table></div>
    <p class="fig-cap"><small>Prices and limits change often; check each provider's current pricing page before you commit.</small></p>
  </div>

  <div class="card">
    <h3>How to choose</h3>
    <div class="prose"><ul>
      <li><b>Want it working today over a few PDFs?</b> Way 1, Gemini File Search.</li>
      <li><b>Need to choose the model, vector database or chunking, or add steps like "check the answer, retry"?</b> Way 2, LangGraph.</li>
      <li><b>Data must stay in your company's cloud?</b> Cloud-managed RAG.</li>
      <li><b>Only one to three documents?</b> Long context; skip retrieval.</li>
    </ul></div>
    <p class="analogy"><b>My suggestion for your build:</b> start with Way 1 to prove the value on real procurement contracts, then move to Way 2 when you need control, such as clause-level chunking, a model other than Gemini, or a step that checks every answer cites a clause. For a PM, this is <b>buy vs build</b>: Way 1 is faster but ties your documents to one vendor; Way 2 costs engineering time but keeps you provider-agnostic.</p>
  </div>`;
}

function bindRag(){
  const box = $("#ragSteps"); if (!box) return;
  const draw = () => {
    const m = RAG_MODES[ragMode];
    box.innerHTML = RAG_STEPS.map((s, i) => { const [who, note] = m[2][i];
      const label = who === "you" ? "You" : who === "skip" ? "Skipped" : m[1];
      return `<div class="rag-step ${who}"><span class="rs-n">${i + 1}</span><b>${esc(s)}</b><span class="rs-who">${esc(label)}</span><small>${esc(note)}</small></div>`; }).join("");
  };
  document.querySelectorAll("[data-rag]").forEach(b => b.onclick = () => {
    ragMode = b.dataset.rag;
    document.querySelectorAll("[data-rag]").forEach(x => { const on = x === b; x.setAttribute("aria-pressed", on); x.setAttribute("aria-checked", on); });
    draw();
  });
  draw();
}

    <p>You pass the Pydantic model to <code>client.messages.parse()</code> as <code>output_format</code>. The SDK sends its schema to Claude, checks the response, and returns the filled-in model in <code>parsed_output</code>.</p>
    <p class="analogy"><b>Procurement analogy:</b> it’s like making vendors submit quotes on your standard template instead of free-form emails. Every reply has the same fields, so you can compare them automatically.</p>
  </div>

  <div class="card">
    <h3>Is it standard to use the Pydantic model?</h3>
    <p>Yes. In Python, Pydantic is the most common way to define structured output.</p>
    <p><b>Why it’s the usual choice:</b></p>
    <div class="prose"><ul>
      <li><b>The SDKs support it directly.</b> Gemini, OpenAI and Claude all accept a Pydantic model and give you back a filled-in object. Groq accepts its schema through <code>StockMove.model_json_schema()</code>.</li>
      <li><b>It checks the data.</b> If the AI returns the wrong type, such as text where a number should be, Pydantic raises an error instead of letting bad data through.</li>
      <li><b>It’s used beyond AI.</b> Web frameworks like FastAPI and agent frameworks like LangChain and PydanticAI use it too, so it’s worth learning once.</li>
    </ul></div>
    <p><b>The alternatives, used less often:</b></p>
    <div class="tbl"><table><thead><tr><th>Option</th><th>When it’s used</th></tr></thead><tbody>
      <tr><td>A raw JSON schema (a plain dictionary)</td><td>When there’s no SDK helper, or for other languages</td></tr>
      <tr><td>Python dataclass / TypedDict</td><td>Simple cases; no automatic validation</td></tr>
      <tr><td>Zod</td><td>The TypeScript/JavaScript equivalent of Pydantic</td></tr>
    </tbody></table></div>
    <p>Under the hood, all of these become a JSON schema, a standard description of the fields and their types. Pydantic is simply the easiest way to write one in Python.</p>
    <p class="analogy"><b>For a PM,</b> think of the Pydantic model as the data contract between the AI and the rest of your system.</p>
  </div>`;

/* tiny markdown renderer for notebook text cells: headings, tables, lists, bold, inline code */
function md(src){
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  const lines = src.split("\n"), out = []; let i = 0;
  while (i < lines.length){
    const l = lines[i];
    if (/^#{1,6} /.test(l)){ const n = l.match(/^#+/)[0].length; out.push(`<p class="nb-h nb-h${n}">${inline(l.replace(/^#+ /, ""))}</p>`); i++; }
    else if (l.trim().startsWith("|")){
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((_, k) => k !== 1);
      out.push(`<div class="tbl"><table><thead><tr>${cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    else if (/^\d+\. /.test(l)){ const it = []; while (i < lines.length && /^\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\d+\. /, "")); out.push(`<ol>${it.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`); }
    else if (l.trim()){ out.push(`<p>${inline(l)}</p>`); i++; }
    else i++;
  }
  return out.join("");
}

    document.querySelectorAll("[data-agent]").forEach(b => b.onclick = () => { agentMode = b.dataset.agent; agentAt = -1; draw(); });

}

function guardWidget(){
  return `<div class="widget"><span class="eyebrow">Pick a request</span>

function bindGuard(){
  if (!$("#gsGates")) return;
  const draw = () => {
    const s = GSCEN[gsel];
    document.querySelectorAll("[data-gs]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.gs === gsel));
    $("#gsFull").textContent = "“" + s.q + "”";
    let stoppedAt = null;
    const cells = GATES.map(([id, n, name]) => {
      const off = !!goff[id], role = s.stop[id];
      let st = "pass", note = off ? "switched off" : "passes";
      if (!off && role && !stoppedAt){ stoppedAt = id; st = "stop"; note = "stops it"; }
      else if (stoppedAt) { st = "idle"; note = "not reached"; }
      else if (off && role) { st = "offrole"; note = "off: would have caught it"; }
      return `<button class="gs-gate ${st} ${off ? "off" : ""}" data-gate="${id}" aria-pressed="${!off}" title="Switch this gate ${off ? "on" : "off"}"><span class="mono">${n}</span><b>${esc(name)}</b><small>${note}</small></button>`;
    });
    $("#gsGates").innerHTML = `<span class="gs-end">Request</span>` + cells.join('<span class="gs-arrow" aria-hidden="true">→</span>') + `<span class="gs-end">${stoppedAt ? "Blocked" : "Reaches the world"}</span>`;
    const offCount = Object.values(goff).filter(Boolean).length;
    if (stoppedAt) $("#gsOut").innerHTML = `<div class="gs-res ok"><b>${esc(GATES.find(g => g[0] === stoppedAt)[2])}:</b> ${esc(s.stop[stoppedAt])}</div>`;

    else $("#gsOut").innerHTML = `<div class="gs-res bad"><b>Nothing caught it.</b> ${esc(s.harm)}</div>`;
    $("#gsOut").innerHTML += offCount ? `<button class="linkbtn" id="gsReset">Switch all gates back on</button>` : "";
    document.querySelectorAll("[data-gate]").forEach(b => b.onclick = () => { goff[b.dataset.gate] = !goff[b.dataset.gate]; draw(); });
    const r = $("#gsReset"); if (r) r.onclick = () => { goff = {}; draw(); };
  };
  document.querySelectorAll("[data-gs]").forEach(b => b.onclick = () => { gsel = +b.dataset.gs; draw(); });
  draw();
}

  if (kind === "patParallel") return `<div class="widget"><div class="swap"><button class="chip" data-par="sequential" aria-pressed="false">One after another</button><button class="chip" data-par="parallel" aria-pressed="true">All at once (asyncio.gather)</button></div>
    <div class="par" id="par"></div><p class="msg" id="parSum"></p><p class="fig-cap"><small>Each call takes about 5 seconds here; your notebook's parallel run took 5.3 seconds for all three.</small></p></div>`;
  if (kind === "patReact") return `<div class="widget"><span class="eyebrow">“I'm visiting a client in Tokyo next week with 50,000 rupees. How many yen is that, and what should I pack?”</span><ol class="agent-steps" id="reactSteps"></ol><div class="pipe-nav"><button class="btn" id="reactNext">Step through →</button><button class="btn ghost" id="reactAll">Show all</button></div></div>`;
  if (kind === "patReflect") return `<div class="widget"><div class="swap"><button class="chip" data-att="0" aria-pressed="true">Attempt 1</button><button class="chip" data-att="1" aria-pressed="false">Attempt 2</button></div>
    <div class="ref-grid"><div><span class="eyebrow">Checker's rules</span><ul class="ref-rules" id="refRules"></ul></div><div><span class="eyebrow">Writer's draft</span><pre class="chain-out" id="refText"></pre></div></div><div class="gs-res" id="refFb"></div></div>`;
  if (kind === "patHitl") return `<div class="widget"><span class="eyebrow">Customer: “My order came 2 hours late and the ice cream had melted. I want a full refund NOW.”</span><div id="hitlBox"></div></div>`;
  if (kind === "patQuiz") return `<div class="widget quiz"><span class="eyebrow">Which pattern fits?</span><div class="quiz-q" id="pqQ"></div><div class="opts" id="pqO"></div><div class="quiz-foot"><span>Score <b id="pqS">0</b> / <b id="pqT">0</b></span><button class="btn" id="pqN" disabled>Next situation</button></div></div>`;
  return "";
}

function bindPatterns(){
  if ($("#chainOut")){
    const draw = () => { document.querySelectorAll("[data-chain]").forEach(b => { const i = +b.dataset.chain; b.classList.toggle("on", i === chainAt); b.classList.toggle("done", i < chainAt); });
      $("#chainOut").textContent = CHAIN[chainAt][2];
      $("#chainCap").textContent = chainAt === 0 ? "The raw meeting notes: the input to step 1." : `Output of “${CHAIN[chainAt][0]}”, which becomes the input of ${chainAt < CHAIN.length - 1 ? "“" + CHAIN[chainAt + 1][0] + "”" : "nothing: it's the final email"}.`; };
    document.querySelectorAll("[data-chain]").forEach(b => b.onclick = () => { chainAt = +b.dataset.chain; draw(); }); draw();
  }
  if ($("#rtReply")){
    const draw = () => { const t = TICKETS[tkSel];
      document.querySelectorAll("[data-tk]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.tk === tkSel));
      $("#rtIn").innerHTML = `<b>Ticket</b><small>${esc(t[0])}</small>`;
      document.querySelectorAll("[data-rt]").forEach(d => d.classList.toggle("on", +d.dataset.rt === t[1]));
      $("#rtReply").innerHTML = `<span class="mono">result.last_agent.name → <b>${esc(ROUTES[t[1]])}</b></span><p>${esc(t[2])}</p>`; };
    document.querySelectorAll("[data-tk]").forEach(b => b.onclick = () => { tkSel = +b.dataset.tk; draw(); }); draw();
  }
  if ($("#par")){
    const jobs = [["Sentiment", 4.6], ["Issues", 5.1], ["Reply", 5.3]];
    const draw = () => { document.querySelectorAll("[data-par]").forEach(b => b.setAttribute("aria-pressed", b.dataset.par === parMode));
      const total = parMode === "parallel" ? Math.max(...jobs.map(j => j[1])) : jobs.reduce((a, j) => a + j[1], 0), scale = 15;
      let t = 0;
      $("#par").innerHTML = jobs.map(([n, d]) => { const s = parMode === "parallel" ? 0 : t; t += d;
        return `<div class="par-row"><span>${n} agent</span><div class="par-track"><i style="left:${s / scale * 100}%;width:${d / scale * 100}%"></i></div></div>`; }).join("") +
        `<div class="par-row axis"><span></span><div class="par-track ticks">${[0, 5, 10, 15].map(x => `<em style="left:${x / scale * 100}%">${x}s</em>`).join("")}</div></div>`;
      $("#parSum").innerHTML = `Total: <b>${total.toFixed(1)} seconds</b>` + (parMode === "parallel" ? " · 3 LLM calls in about the time of 1" : " · each call waits for the one before"); };
    document.querySelectorAll("[data-par]").forEach(b => b.onclick = () => { parMode = b.dataset.par; draw(); }); draw();
  }
  if ($("#reactSteps")){
    const draw = () => { $("#reactSteps").innerHTML = REACT.map(([k, t], i) => `<li class="ag ${k === "observe" ? "check" : k === "act" ? "search" : k} ${reactAt === -1 || i <= reactAt ? "shown" : ""} ${i === reactAt ? "now" : ""}"><span class="ag-k">${k}</span><span class="${k === "act" ? "mono" : ""}">${esc(t)}</span></li>`).join("");
      $("#reactNext").textContent = reactAt === -1 || reactAt >= REACT.length - 1 ? "Step through →" : "Next step →"; };
    $("#reactNext").onclick = () => { reactAt = (reactAt === -1 || reactAt >= REACT.length - 1) ? 0 : reactAt + 1; draw(); };
    $("#reactAll").onclick = () => { reactAt = -1; draw(); }; draw();
  }
  if ($("#refRules")){
    const draw = () => { const a = ATTEMPTS[refAt];
      document.querySelectorAll("[data-att]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.att === refAt));
      $("#refRules").innerHTML = RULES.map((r, i) => `<li class="${a.ok[i] ? "ok" : "bad"}"><span>${a.ok[i] ? "✓" : "✕"}</span>${esc(r)}</li>`).join("");
      $("#refText").textContent = a.text;
      $("#refFb").className = "gs-res " + (refAt ? "ok" : "bad");
      $("#refFb").textContent = refAt ? a.fb : "Checker: not good → " + a.fb + " The feedback goes back to the writer."; };
    document.querySelectorAll("[data-att]").forEach(b => b.onclick = () => { refAt = +b.dataset.att; draw(); }); draw();
  }
  if ($("#hitlBox")){
    const draw = () => {
      const log = hitl.log.map(l => `<li>${esc(l)}</li>`).join("");
      if (hitl.status === "sent") { $("#hitlBox").innerHTML = `<ol class="hitl-log">${log}</ol><div class="gs-res ok">📧 Reply sent to the customer. The agent reports back: “I have sent a reply apologising and asking for the order details.”</div><button class="linkbtn" id="hitlReset">Start again</button>`; $("#hitlReset").onclick = () => { hitl = { draft: "first", status: "waiting", log: [] }; draw(); }; return; }
      $("#hitlBox").innerHTML = `${log ? `<ol class="hitl-log">${log}</ol>` : ""}<div class="hitl-draft"><span class="eyebrow">⏸ Paused: send_reply needs approval</span><p>${esc(HITL_DRAFTS[hitl.draft])}</p></div>
        <div class="pipe-nav"><button class="btn" id="hApprove">Approve and send</button><button class="btn ghost" data-rej="shorter">Reject: make it shorter</button><button class="btn ghost" data-rej="coupon">Reject: offer a 10% coupon</button></div>`;
      $("#hApprove").onclick = () => { hitl.log.push("Manager approved → state.approve(…)"); hitl.status = "sent"; draw(); };
      document.querySelectorAll("[data-rej]").forEach(b => b.onclick = () => { hitl.log.push(`Manager rejected: “${b.dataset.rej === "shorter" ? "make it shorter" : "offer a 10% coupon"}” → the agent rewrites and asks again`); hitl.draft = b.dataset.rej; draw(); });
    };
    draw();
  }
  if ($("#pqQ")){
    let order = PQ.map((_, i) => i).sort(() => Math.random() - .5), pos = 0, score = 0, done = 0;
    const show = () => { const [q, ans] = PQ[order[pos]];
      $("#pqQ").textContent = q; $("#pqN").disabled = true;
      $("#pqO").innerHTML = PNAMES.map(n => `<button>${esc(n)}</button>`).join("");
      $("#pqO").querySelectorAll("button").forEach((b, i) => b.onclick = () => { if (!$("#pqN").disabled) return;
        done++; if (i === ans) score++;
        $("#pqO").querySelectorAll("button").forEach((x, j) => { if (j === ans) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
        $("#pqS").textContent = score; $("#pqT").textContent = done; $("#pqN").disabled = false;
        $("#pqN").textContent = pos === PQ.length - 1 ? "Start again" : "Next situation"; }); };
    $("#pqN").onclick = () => { pos++; if (pos >= PQ.length){ pos = 0; score = 0; done = 0; order.sort(() => Math.random() - .5); $("#pqS").textContent = 0; $("#pqT").textContent = 0; } show(); };
    show();
  }
}

function widget(kind, s){
  const rw = ragWidget(kind); if (rw) return rw;
  const pw = patWidget(kind); if (pw) return pw;
  const aw = archWidget(kind); if (aw) return aw;
  if (kind === "guardSim") return guardWidget();
  if (kind === "steps") return `<div class="widget"><span class="eyebrow">Click through the four steps</span>
    <div class="steps">${["authenticate","choose a model","send messages","read the response"].map((t,i)=>
      `<button class="step${i===0?" on":""}" data-step="${i}"><small>step ${i+1}</small>${t}</button>`).join("")}</div>
    <div class="flow-note" id="flowNote">send text → get text back</div></div>`;

  if (kind === "swap") return `<div class="widget"><span class="eyebrow">Swap the provider, keep the code</span>
    <div class="swap">${["Groq","OpenRouter"].map((p,i)=>`<button class="chip" aria-pressed="${i===0}" data-prov="${p}">${p}</button>`).join("")}</div>
    <pre id="swapCode"></pre></div>`;

  if (kind === "tradeoffs") return `<div class="widget"><span class="eyebrow">Pick a side of each trade-off</span>
    <div class="pairs">${[["big","gpt-oss-120b"],["small","gpt-oss-20b"],["free"],["paid"],["fast"],["smart"]]
      .reduce((a,_,i,arr)=> i%2? a : a.concat([[arr[i],arr[i+1]]]), [])
      .map(([a,b],r)=>`<div class="pair" data-row="${r}">
        <button aria-pressed="true">${a[0]}${a[1]?` <span class="mono">(${a[1]})</span>`:""}</button><span>vs</span>
        <button aria-pressed="false">${b[0]}${b[1]?` <span class="mono">(${b[1]})</span>`:""}</button></div>`).join("")}</div>
    <span class="eyebrow" style="margin-top:4px">Non-chat models in the list</span>
    <div class="tags"><span class="tag">safety filters</span><span class="tag">speech to text</span><span class="tag">text to speech</span></div></div>`;

  if (kind === "temperature") return `<div class="widget"><span class="eyebrow">Drag the temperature</span>
    <div class="temp-row"><span class="mono">temperature</span><input type="range" id="temp" min="0" max="1" step="0.1" value="0.2" aria-label="Temperature"><span class="temp-val" id="tempVal">0.2</span></div>
    <div class="scale"><span>predictability</span><span>creativity</span></div>
    <div class="temp-out" id="tempOut"></div></div>`;

  if (kind === "errors") return `<div class="tbl"><table><thead><tr><th>Error</th><th>Layer</th></tr></thead><tbody>
    ${s.errors.map(([e,l])=>`<tr><td class="mono">${esc(e)}</td><td>${esc(l)}</td></tr>`).join("")}</tbody></table></div>
    <div class="widget quiz" id="quiz"><span class="eyebrow">Which layer broke?</span>
      <div class="quiz-q" id="qq"></div><div class="opts" id="qo"></div>
      <div class="quiz-foot"><span>Score <b id="qs">0</b> / <b id="qt">0</b></span><button class="btn" id="qn" disabled>Next error</button></div></div>`;
  return "";
}

function bind(){
  document.querySelectorAll(".lesson-head").forEach(btn => btn.onclick = () => toggle(btn.parentElement));
  $("#expandAll").onclick = e => {
    const all = [...document.querySelectorAll(".lesson")], open = all.some(a => !a.classList.contains("open"));
    all.forEach(a => toggle(a, open)); e.target.textContent = open ? "Collapse all" : "Expand all";
  };
  document.querySelectorAll(".done-toggle").forEach(b => b.onclick = () => {
    const k = b.dataset.key; done[k] = !done[k]; if (!done[k]) delete done[k]; store.set("fieldnotes-done", done);
    b.closest(".lesson").classList.toggle("done", !!done[k]);
    b.textContent = done[k] ? "✓ Understood" : "Mark as understood"; progress();
  });

  // steps
  const notes = ["your key proves who you are", "pick which model answers", "send text", "get text back"];
  document.querySelectorAll(".step").forEach(b => b.onclick = () => {
    document.querySelectorAll(".step").forEach(x => x.classList.toggle("on", x === b));
    $("#flowNote").textContent = `step ${+b.dataset.step + 1} of 4 · ${notes[b.dataset.step]}`;
  });

  // swap
  const code = p => `client = OpenAI(\n    api_key=...,\n    <span class="hl">base_url="&lt;${p} base_url&gt;"</span>,\n)\nask("Hello")   <span style="color:var(--muted)"># same function, different provider</span>`;
  if ($("#swapCode")) $("#swapCode").innerHTML = code("Groq");
  document.querySelectorAll("[data-prov]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-prov]").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("#swapCode").innerHTML = code(b.dataset.prov);
  });

  // tradeoffs
  document.querySelectorAll(".pair").forEach(r => r.querySelectorAll("button").forEach(b => b.onclick = () =>
    r.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b))));

  // temperature
  const t = $("#temp");
  if (t){ const upd = () => { const v = +t.value; $("#tempVal").textContent = v.toFixed(1);
      $("#tempOut").textContent = v <= 0.3 ? "Low: suits extraction or contract checks."
        : v >= 0.7 ? "Higher: suits brainstorming." : "Middle: trading predictability for creativity."; };
    t.oninput = upd; upd(); }

  if ($("#quiz")) quiz(current.errors);
  bindRagTopic();
  bindGuard();
  bindPatterns();
  bindArch();
  document.querySelectorAll("[data-goto-concept]").forEach(a => a.onclick = () => { concept = a.dataset.gotoConcept; store.set("fieldnotes-concept", concept); });
}

function toggle(el, force){
  const open = force === undefined ? !el.classList.contains("open") : force;
  el.classList.toggle("open", open);
  el.querySelector(".lesson-head").setAttribute("aria-expanded", open);
  el.querySelector(".lesson-body").hidden = !open;
}

function quiz(errors){
  const layers = errors.map(e => e[1]);
  let order = errors.map((_, i) => i).sort(() => Math.random() - .5), pos = 0, score = 0, answered = 0;
  const show = () => {
    const [err, layer] = errors[order[pos]];
    $("#qq").textContent = err; $("#qn").disabled = true;
    $("#qo").innerHTML = layers.map(l => `<button>${esc(l)}</button>`).join("");
    $("#qo").querySelectorAll("button").forEach(b => b.onclick = () => {
      if (!$("#qn").disabled) return;
      answered++; if (b.textContent === layer) score++;
      $("#qo").querySelectorAll("button").forEach(x => {
        if (x.textContent === layer) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
      $("#qs").textContent = score; $("#qt").textContent = answered;
      $("#qn").disabled = false; $("#qn").textContent = pos === errors.length - 1 ? "Start again" : "Next error";
    });
  };
  $("#qn").onclick = () => { pos++; if (pos >= errors.length){ pos = 0; score = 0; answered = 0;
      order.sort(() => Math.random() - .5); $("#qs").textContent = 0; $("#qt").textContent = 0; } show(); };
  show();
}

window.addEventListener("hashchange", () => {
  view = viewFromHash();
  current = SESSIONS.find(s => "#" + s.id === location.hash) || SESSIONS[0]; render();
  const first = document.querySelector(".lesson"); if (first) toggle(first, true);
});
initProjects();
render();
const firstLesson = document.querySelector(".lesson"); if (firstLesson) toggle(firstLesson, true);
</script>
