<title>AI Engineering Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook column; session switcher on top, numbered lessons as expandable entries, PM mapping and next step below. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eceef3; --fg:#171a21; --muted:#5b6170;
  --line:#d9dce4; --accent:#3a4fd6; --accent-soft:#e3e7fb; --accent-fg:#ffffff;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --bad:#c2410c; --bad-soft:#fde7dc;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1a1d25; --sunk:#232733; --fg:#e8eaf0; --muted:#9aa0b0;
  --line:#2e3341; --accent:#8b9bff; --accent-soft:#262c4d; --accent-fg:#10121a;
  --ok:#4fd19a; --ok-soft:#173a2b; --bad:#ff9a6b; --bad-soft:#3d2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1a1d25; --sunk:#232733; --fg:#e8eaf0; --muted:#9aa0b0;
  --line:#2e3341; --accent:#8b9bff; --accent-soft:#262c4d; --accent-fg:#10121a;
  --ok:#4fd19a; --ok-soft:#173a2b; --bad:#ff9a6b; --bad-soft:#3d2219; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.sheet{background:var(--bg);border-radius:14px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.eyebrow{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--sunk);padding:1px 6px;border-radius:5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:14px;background:var(--bg);padding:8px 0}
.lede{color:var(--muted);max-width:62ch}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab.add{border-style:dashed;color:var(--muted);cursor:default}

.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.progress b{font-variant-numeric:tabular-nums;color:var(--fg)}

.section{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--accent);font-size:14px;padding:4px 0}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lesson.done{border-color:var(--ok)}
.lesson-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;width:100%;
  text-align:left;background:none;border:none;padding:16px 18px}
.num{font:600 14px/1 var(--mono);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.lesson.done .num{background:var(--ok-soft);color:var(--ok)}
.lesson-head h3{padding-top:3px}
.chev{width:22px;height:22px;margin-top:4px;color:var(--muted);transition:transform .2s}
.lesson.open .chev{transform:rotate(180deg)}
.lesson-body{padding:0 18px 18px 62px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lesson-body p{max-width:66ch}
.done-toggle{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:14px;
  border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:8px}
.lesson.done .done-toggle{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

.widget{background:var(--sunk);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.widget .eyebrow{font-size:11px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;
  display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.step small{font:500 11px var(--mono);color:var(--muted)}
.step.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.flow-note{font:13px var(--mono);color:var(--muted)}

/* swap */
.swap{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font:13px/1.5 var(--mono)}
pre .hl{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}

/* tradeoffs */
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px}
.pair button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pair span{font:12px var(--mono);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:12px var(--mono);padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}

/* temperature */
.temp-row{display:flex;align-items:center;gap:12px}
.temp-row input{flex:1;accent-color:var(--accent)}
.temp-val{font:600 15px var(--mono);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.scale{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.temp-out{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}

/* error table + quiz */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:none}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz-q{font:500 15px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;text-align:left}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);gap:8px;flex-wrap:wrap}
.quiz-foot b{font-variant-numeric:tabular-nums;color:var(--fg)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:default}

/* PM */
.pm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pm h3{font-size:16px}
.pm p{font-size:15px;color:var(--muted)}

.next{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.next .eyebrow{color:var(--accent)}
.fields{display:flex;gap:6px;flex-wrap:wrap}
.fields .tag{background:var(--surface)}

/* block diagrams */
.dg-wrap{background:var(--sunk);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dg-wrap .eyebrow{font-size:11px}
.dg{display:flex;align-items:center;min-width:0}
.dg-col{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0}
.node{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.node small{display:block;font:400 11px/1.35 var(--mono);color:var(--muted);margin-top:3px}
.node.accent{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.node.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.node.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.node.ghost{border-style:dashed;background:transparent;color:var(--muted);font-weight:500}
.node.accent small,.node.ok small,.node.bad small{color:inherit;opacity:.8}
.dg-arrow{flex:0 0 26px;display:grid;place-items:center;color:var(--muted)}
.dg-arrow svg{width:22px;height:22px}
.dg.v{flex-direction:column;align-items:stretch}
.dg.v .dg-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
.dg.v .dg-col .node{flex:1 1 140px}
.dg.v .dg-arrow{flex-basis:24px}
.dg.v .dg-arrow svg{transform:rotate(90deg)}
.dg-cap{font-size:13px;color:var(--muted)}
.pm-dgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){
  .dg{flex-direction:column;align-items:stretch}
  .dg-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .dg-col .node{flex:1 1 130px}
  .dg-arrow{flex-basis:24px}
  .dg-arrow svg{transform:rotate(90deg)}
  .pm-dgs{grid-template-columns:1fr}
}

/* learning concepts */
.tab.concept{border-color:var(--accent);color:var(--accent)}
.tab.concept[aria-selected="true"]{color:var(--accent-fg)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);background:var(--bg)}
.subtab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font:600 15px var(--display);color:var(--muted);margin-bottom:-1px}
.subtab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.concept-body{display:flex;flex-direction:column;gap:22px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:66ch}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fig-cap{font-size:13px;color:var(--muted);max-width:66ch}
.fig-cap b{color:var(--fg)}
.fig-cap small{display:block;font-size:12px;margin-top:2px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.prompt-box{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:18px 16px;font-size:17px;min-height:64px}
.prompt-box mark{background:var(--accent-soft);color:var(--accent);padding:0 4px;border-radius:4px;font-weight:600}
.toks{display:flex;flex-direction:column;gap:6px}
.tok{display:grid;grid-template-columns:92px 1fr 46px;gap:12px;align-items:center;font:13px var(--mono);padding:2px 4px;border-radius:5px}
.tok .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.tok .fill{height:100%;background:var(--muted);opacity:.55;border-radius:99px;transition:width .35s ease}
.tok .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tok.picked{background:var(--accent-soft)}
.tok.picked .fill{background:var(--accent);opacity:1}
.tok.picked .name,.tok.picked .pct{color:var(--accent);font-weight:600}
.controls{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.controls label{font-size:14px;color:var(--muted)}
.controls input[type=range]{flex:1;min-width:140px;accent-color:var(--fg)}
.controls .tv{font:600 14px var(--mono);min-width:3ch;font-variant-numeric:tabular-nums}
.btn.ghost{background:var(--surface);color:var(--accent)}
.hist{display:flex;flex-wrap:wrap;gap:4px;font-size:13px;color:var(--muted);align-items:center;min-height:24px}
.hist .tag.fav{border-color:var(--accent);color:var(--accent)}
.mol{width:100%;height:150px;display:block;background:var(--sunk);border-radius:8px}
.hc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hc div{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
.hc b{display:block;font-family:var(--display);margin-bottom:2px}
.hist3{display:flex;flex-direction:column;gap:0}
.hist3 .row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.hist3 .row:first-child{border-top:none;padding-top:0}
.hist3 .era{font:500 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.hist3 .era small{display:block;color:var(--muted);letter-spacing:0;text-transform:none}
.runs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.runs pre{font-size:12.5px}
.runs h4{margin:0 0 6px;font:600 14px var(--display)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{font-weight:600}
.kv dd{margin:0;color:var(--muted)}
@media (max-width:600px){
  .tok{grid-template-columns:78px 1fr 40px;gap:8px}
  .hc,.runs{grid-template-columns:1fr}
  .hist3 .row{grid-template-columns:1fr;gap:4px}
}

/* notebook */
.nb-out{margin-top:4px;border-left:3px solid var(--line);background:var(--bg)!important;color:var(--muted)}
.nb-out-label{font:11px var(--mono);color:var(--muted);padding:6px 2px 2px}
.nb-body{display:flex;flex-direction:column;gap:10px}
.nb-cell{min-width:0}
.nb-md{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.nb-md ol{margin:0;padding-left:22px}
.nb-h{font-family:var(--display);font-weight:600}
.nb-h1{font-size:20px}.nb-h2{font-size:17px}
.nb-bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:0 2px 4px}
.nb-copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:12px}
.nb pre{white-space:pre;tab-size:4}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);text-align:center}

@media (max-width:600px){
  .lesson-body{padding:0 14px 16px 14px}
  .lesson-head{padding:14px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .pm-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">AI engineering · learning log</span>
    <h1>AI Engineering Guide</h1>

</div>

<script>
/* ============================================================

const SESSIONS = [
  {
    id: "calling-llms-through-apis",
    label: "Calling LLMs through APIs",
    title: "Calling LLMs through APIs",
    notebook: { file: "Calling_LLMs_through_APIs.ipynb", cells: [{"t": "markdown", "s": "# Connect to AI models from different platforms\nSame pattern for every platform:\n1. **Get an API key** from the platform's website\n2. **Save it in Colab Secrets** (🔑 icon on the left) with the exact name shown, and turn on *Notebook access*\n3. **Run the cell**: it reads the key with `userdata.get(...)`, sends a prompt and prints the reply\n\n| Platform | Secret name | Where to get the key | Free? |\n|---|---|---|---|\n| Google Gemini | `GEMINI_API_KEY` | aistudio.google.com/apikey | Yes (free tier) |\n| OpenAI (GPT) | `OPENAI_API_KEY` | platform.openai.com/api-keys | Paid |\n| Anthropic (Claude) | `ANTHROPIC_API_KEY` | console.anthropic.com | Paid (separate from Claude Pro) |\n| Groq (Llama, Qwen…) | `GROQ_API_KEY` | console.groq.com/keys | Yes (free tier) |\n| OpenRouter (300+ models, one key) | `OPENROUTER_API_KEY` | openrouter.ai/keys | Some free models |\n\n**Tip:** model names change often. If you see a *model not found* error, run the \"list models\" line in that section and copy a current name."}, {"t": "markdown", "s": "**0. Pre Requisite**"}, {"t": "code", "s": "\n# STEP 0: Install the client libraries\n# WHY (tech): Downloads each provider's Python SDK, which handles HTTP requests, authentication and response parsing.\n# ELI5: Download translator apps so Python can talk to each AI company.\n# WHY (tech): --force-reinstall replaces half-updated files; -U gets the newest version; -q hides install logs.\n# ELI5: Throw away old copies and quietly fetch fresh ones.\n!pip install --force-reinstall -q -U google-genai openai anthropic\n# AFTER THIS CELL: Runtime -> Restart session, so Python loads the new versions (avoids ImportError).\n# ELI5: Restart the machine so it uses the new parts."}, {"t": "code", "s": "# WHY (tech): Imports Colab's secrets manager so API keys are read at runtime, never hard-coded.\n# ELI5: Get the key to the locked drawer where your passwords live.\nfrom google.colab import userdata\n\n# WHY (tech): One shared prompt variable means every provider gets identical input, making comparisons fair.\n# ELI5: Write the question once on a card and show it to everyone.\nPROMPT = \"Explain what a invoice is in one sentence.\"\n\n# WHY (tech): Prints the variable to confirm it was assigned correctly before any API call.\n# ELI5: Read the card aloud to check it says the right thing.\nprint(PROMPT)", "o": "Explain what a invoice is in one sentence."}, {"t": "code", "s": "  #from google.colab import userdata\n  #print(userdata.get(\"GEMINI_API_KEY\"))\n\n  # WHY (tech): Reads the key from Colab Secrets into a variable without displaying the full value.\n# ELI5: Take the key out of the drawer, but keep it in your pocket.\nfrom google.colab import userdata\nkey = userdata.get(\"GEMINI_API_KEY\")\n\n# WHY (tech): Prints only the first 6 characters and the length, enough to confirm the key loaded.\n# ELI5: Show just the tip of the key to prove you have it.\nprint(key[:6], \"... length:\", len(key))", "o": "AQ.Ab8 ... length: 53"}, {"t": "code", "s": "# WHY (tech): Reads the OpenAI key from Colab Secrets into a variable, without displaying it.\n# ELI5: Take OpenAI's key out of the drawer.\nfrom google.colab import userdata\nkey = userdata.get(\"OPENAI_API_KEY\")\n\n# WHY (tech): Prints only the first 6 characters to confirm the key loaded, keeping the rest hidden.\n# ELI5: Show just the tip of the key.\nprint(key[:6], \"...\")"}, {"t": "code", "s": "# WHY (tech): Reads the Anthropic key from Colab Secrets into a variable, without displaying it.\n# ELI5: Take Claude's key out of the drawer.\nfrom google.colab import userdata\nkey = userdata.get(\"ANTHROPIC_API_KEY\")\n\n# WHY (tech): Prints only the first 6 characters to confirm the key loaded, keeping the rest hidden.\n# ELI5: Show just the tip of the key.\nprint(key[:6], \"...\")"}, {"t": "code", "s": "# WHY (tech): Reads the Groq key from Colab Secrets into a variable, without displaying it.\n# ELI5: Take Groq's key out of the drawer.\nfrom google.colab import userdata\nkey = userdata.get(\"GROQ_API_KEY\")\n\n# WHY (tech): Prints only the first 6 characters to confirm the key loaded, keeping the rest hidden.\n# ELI5: Show just the tip of the key.\nprint(key[:6], \"...\")"}, {"t": "markdown", "s": "## 1. Google Gemini"}, {"t": "code", "s": "# WHY (tech): Imports Google's Gen AI SDK, which provides the Client class used to call Gemini.\n# ELI5: Bring in Google's phone so we can call Gemini.\nfrom google import genai\n\n# WHY (tech): Imports typed config objects so settings like temperature are validated before sending.\n# ELI5: Get Google's order form with a box for each setting.\nfrom google.genai import types\n\n# WHY (tech): Creates an authenticated client once; every later request reuses this connection and key.\n# ELI5: Call Google and show your ID card once.\ngemini = genai.Client(api_key=userdata.get(\"GEMINI_API_KEY\"))\n\n# WHY (tech): Sends one generation request and blocks until Gemini returns the full response object.\n# ELI5: Hand over your question and wait for the answer.\nresp = gemini.models.generate_content(\n    # WHY (tech): Exact model ID to use; a misspelled or retired name returns a 404 error.\n    # ELI5: Choose which Gemini brain answers.\n    model=\"gemini-3.8-flash\",\n    # WHY (tech): The input text the model reads before generating its reply.\n    # ELI5: The question itself.\n    contents=PROMPT,\n    # WHY (tech): Temperature scales sampling randomness: low gives consistent output, high gives varied output.\n    # ELI5: How adventurous the AI is when choosing words.\n    config=types.GenerateContentConfig(temperature=0.7),\n)\n\n# WHY (tech): .text extracts only the generated answer from a response that also holds metadata and token counts.\n# ELI5: Open the envelope and read only the letter.\nprint(resp.text)"}, {"t": "code", "s": "# WHY (tech): Reinstalls only the openai package, without touching dependencies, to fix the version-mismatch ImportError.\n# ELI5: Replace just the broken part, not the whole machine.\n!pip install -q --force-reinstall --no-deps openai\n# AFTER THIS CELL: Runtime -> Restart session so the fixed version is loaded.\n# ELI5: Restart so the new part is actually used."}, {"t": "markdown", "s": "## 2. OpenAI (GPT)"}, {"t": "code", "s": "# WHY (tech): Imports OpenAI's SDK; many providers (Groq, Gemini, OpenRouter) accept this same request format.\n# ELI5: Bring in OpenAI's phone, which can also dial other companies.\nfrom openai import OpenAI\n\n# WHY (tech): Authenticated client using the default endpoint api.openai.com, with the key read from Secrets.\n# ELI5: Call OpenAI and show your ID card.\nopenai_client = OpenAI(api_key=userdata.get(\"OPENAI_API_KEY\"))\n\n# WHY (tech): Keeping the model name in a variable lets you swap models without editing the request.\n# ELI5: Write the brain's name on a sticky note that's easy to change.\nOPENAI_MODEL = \"gpt-6.1-sol\"\n\n# WHY (tech): Chat Completions endpoint takes a conversation and returns the model's next assistant message.\n# ELI5: Hand over the chat and wait for the reply.\nresp = openai_client.chat.completions.create(\n    # WHY (tech): Tells the API which model processes this request; affects quality, speed and cost.\n    # ELI5: Which brain answers.\n    model=OPENAI_MODEL,\n    # WHY (tech): List of role/content messages; \"user\" marks this text as coming from the human.\n    # ELI5: The chat history; here, just your one question.\n    messages=[{\"role\": \"user\", \"content\": PROMPT}],\n)\n\n# WHY (tech): Response holds a list of choices; we take the first one's message text.\n# ELI5: Pick the first reply and read it.\nprint(resp.choices[0].message.content)", "o": "An invoice is a document a seller sends to a buyer listing the goods or services provided, their costs, and the amount and deadline for payment."}, {"t": "markdown", "s": "## 3. Anthropic (Claude)\nNote: this needs an API key from console.anthropic.com. A Claude Pro/Max chat subscription does not include API credits."}, {"t": "code", "s": "# WHY (tech): Imports Anthropic's SDK, which handles Claude's Messages API format and authentication headers.\n# ELI5: Bring in Anthropic's phone to call Claude.\nimport anthropic\n\n# WHY (tech): Authenticated client; Claude API usage is billed separately from Claude Pro chat subscriptions.\n# ELI5: Call Claude and show your ID card.\nclaude = anthropic.Anthropic(api_key=userdata.get(\"ANTHROPIC_API_KEY\"))\n\n# WHY (tech): Calls Claude's Messages API; the request resembles OpenAI's, but the response shape differs.\n# ELI5: Send Claude your note and wait for a reply.\nresp = claude.messages.create(\n    # WHY (tech): Selects the Claude model ID; if it errors, check claude.models.list() for current names.\n    # ELI5: Choose which Claude brain answers.\n    model=\"claude-sonnet-5-5\",\n    # WHY (tech): Required by Claude; caps output tokens, which also limits cost and response time.\n    # ELI5: Tell Claude the most words it may write.\n    max_tokens=500,\n    # WHY (tech): Disabled because Claude's 2026 API removed temperature; sending it raises a TypeError.\n    # ELI5: Claude no longer has a creativity knob, so we skip it.\n    ##temperature=0.7,\n    # WHY (tech): Same role/content format as OpenAI, so prompts stay portable across providers.\n    # ELI5: Your question, written the same way as before.\n    messages=[{\"role\": \"user\", \"content\": PROMPT}],\n)\n\n# WHY (tech): Claude returns a list of content blocks; the first block holds the text answer.\n# ELI5: Open the first page of Claude's reply and read it.\nprint(resp.content[0].text)\n\n# OPTIONAL - WHY (tech): Lists model IDs your key can access; useful when a model name gets retired.\n# ELI5: Ask Claude's shop for its menu.\n# for m in claude.models.list(): print(m.id)", "o": "An invoice is a document a seller gives a buyer that itemizes the goods or services provided, states the amount owed, and sets out the payment terms."}, {"t": "markdown", "s": "## 4. Groq (open-source models, very fast, free tier)\nGroq speaks the **same format as OpenAI**, so you reuse the OpenAI library and only change `base_url`."}, {"t": "code", "s": "# WHY (tech): Groq exposes an OpenAI-compatible API, so the same SDK works without another library.\n# ELI5: Groq speaks OpenAI's language, so we reuse the same phone.\nfrom openai import OpenAI\n\n# WHY (tech): Creates a client aimed at Groq's servers instead of OpenAI's.\n# ELI5: Set up a phone line to Groq.\ngroq = OpenAI(\n    # WHY (tech): Groq needs its own key; each provider authenticates separately, even with a shared SDK.\n    # ELI5: Groq needs its own ID card.\n    api_key=userdata.get(\"GROQ_API_KEY\"),\n    # WHY (tech): Redirects every request to Groq's endpoint; this single line switches the provider.\n    # ELI5: Same phone, different phone number.\n    base_url=\"https://api.groq.com/openai/v1\",\n)\n\n# WHY (tech): Fetches Groq's live model catalogue so we use valid IDs instead of guessing names.\n# ELI5: Ask Groq for its menu.\nfor m in groq.models.list():\n    # WHY (tech): Prints each model's ID, the exact string the model parameter expects.\n    # ELI5: Read each dish name aloud.\n    print(m.id)", "o": "openai/gpt-oss-safeguard-20b\ncanopylabs/orpheus-arabic-saudi\nwhisper-large-v3-turbo\nopenai/gpt-oss-20b\nopenai/gpt-oss-120b\nallam-2-7b\nwhisper-large-v3\nmeta-llama/llama-prompt-guard-2-86m\nmeta-llama/llama-prompt-guard-2-22m\nqwen/qwen3.8-27b\ncanopylabs/orpheus-v1-english"}, {"t": "code", "s": "# WHY (tech): Picks a chat-capable model; others in the list are guards, speech-to-text or text-to-speech.\n# ELI5: Pick a brain that can actually chat.\nGROQ_MODEL = \"openai/gpt-oss-120b\"\n\n# WHY (tech): Identical call to OpenAI's, because Groq follows the same API contract.\n# ELI5: Same order form, different shop.\nresp = groq.chat.completions.create(\n    # WHY (tech): Which hosted open-source model processes the request.\n    # ELI5: Which brain answers.\n    model=GROQ_MODEL,\n    # WHY (tech): Standard role/content message list, unchanged from the OpenAI example.\n    # ELI5: Your question.\n    messages=[{\"role\": \"user\", \"content\": PROMPT}],\n    # WHY (tech): Groq still supports temperature, so we can control output randomness here.\n    # ELI5: How adventurous the AI is with words.\n    temperature=0.7,\n)\n\n# WHY (tech): Same response structure as OpenAI: first choice, then its message text.\n# ELI5: Pick the first reply and read it.\nprint(resp.choices[0].message.content)", "o": "An invoice is a formal document issued by a seller to a buyer that itemizes goods or services provided, specifies the amounts owed, and requests payment by a designated due date."}, {"t": "code", "s": "# WHY (tech): Re-imports the secrets reader so this cell works on its own after a session restart.\n# ELI5: Grab the drawer key again in case it was forgotten.\nfrom google.colab import userdata\n# WHY (tech): Imported but not used in this cell; harmless and safe to delete.\n# ELI5: An extra tool we brought but never used.\nimport os\n\n# WHY (tech): try/except catches errors like missing secrets and prints guidance instead of crashing.\n# ELI5: Try carefully; if something breaks, explain instead of panicking.\ntry:\n    # WHY (tech): Reads the stored OpenRouter key into a variable, only for local validation checks.\n    # ELI5: Take the key out of the drawer to inspect it.\n    key = userdata.get('OPENROUTER_API_KEY')\n    # WHY (tech): Detects an empty value before any network call wastes time or fails confusingly.\n    # ELI5: Check the drawer isn't empty.\n    if not key:\n        print(\"❌ 'OPENROUTER_API_KEY' is empty or not set in Colab Secrets.\")\n    else:\n        print(\"✅ 'OPENROUTER_API_KEY' found in Secrets!\")\n        # WHY (tech): OpenRouter keys start with \"sk-or-\"; another prefix suggests the wrong key was pasted.\n        # ELI5: Check the key has the right shape.\n        # NOTE: a correct shape does not prove the key is active; only a real API call proves that.\n        if key.startswith(\"sk-or-\"):\n            print(\"✅ Key format looks correct (starts with 'sk-or-').\")\n        else:\n            print(\"⚠️ Warning: OpenRouter keys usually start with 'sk-or-'. Please double check your key.\")\n# WHY (tech): Catches any access error, e.g. notebook access switched off, and shows the reason.\n# ELI5: If the drawer won't open, say why.\nexcept Exception as e:\n    print(f\"❌ Error accessing secret: {e}\")\n    print(\"Please click the 🔑 icon in the left sidebar, add a secret named 'OPENROUTER_API_KEY', and turn on 'Notebook access'.\")", "o": "❌ Error accessing secret: Secret OPENROUTER_API_KEY does not exist.\nPlease click the 🔑 icon in the left sidebar, add a secret named 'OPENROUTER_API_KEY', and turn on 'Notebook access'."}, {"t": "markdown", "s": "## 6. One function for every platform\nMany platforms accept the OpenAI format, so one helper can call them all. Add a platform by adding one line to `PLATFORMS`."}, {"t": "code", "s": "# WHY (tech): One SDK can call every OpenAI-compatible provider, so we import it once for all.\n# ELI5: One universal phone for many companies.\nfrom openai import OpenAI\n\n# WHY (tech): Config table mapping each provider to its secret name and endpoint; adding a provider is one line.\n# ELI5: An address book: company name, its password drawer, its phone number.\nPLATFORMS = {\n    # name:       (secret name,          base_url)\n    # WHY (tech): None means the SDK uses OpenAI's default endpoint.\n    # ELI5: No number needed; OpenAI is the default.\n    \"openai\":     (\"OPENAI_API_KEY\",     None),\n    \"groq\":       (\"GROQ_API_KEY\",       \"https://api.groq.com/openai/v1\"),\n    # WHY (tech): Commented out because this OpenRouter key returned 401; re-enable once a valid key works.\n    # ELI5: Switched off until the key is fixed.\n    #\"openrouter\": (\"OPENROUTER_API_KEY\", \"https://openrouter.ai/api/v1\"),\n    # WHY (tech): Gemini also offers an OpenAI-compatible endpoint, so the same code works for it.\n    # ELI5: Google also answers OpenAI's phone line.\n    \"gemini\":     (\"GEMINI_API_KEY\",     \"https://generativelanguage.googleapis.com/v1beta/openai/\"),\n}\n\n# WHY (tech): Reusable function hides provider differences behind one interface, a mini \"LLM gateway\".\n# ELI5: A machine: put in company, brain and question; get an answer.\ndef ask(platform, model, prompt, temperature=0.7):\n    # WHY (tech): Unpacks the provider's secret name and endpoint from the config table.\n    # ELI5: Look up the company in the address book.\n    secret, base_url = PLATFORMS[platform]\n    # WHY (tech): Builds a client for the chosen provider using its own key and endpoint.\n    # ELI5: Dial that company with its own ID card.\n    client = OpenAI(api_key=userdata.get(secret), base_url=base_url)\n    # WHY (tech): Sends a standard chat request; identical code regardless of which provider is called.\n    # ELI5: Ask the question the same way every time.\n    r = client.chat.completions.create(\n        model=model,\n        messages=[{\"role\": \"user\", \"content\": prompt}],\n        temperature=temperature,\n    )\n    # WHY (tech): Returns only the answer text so callers never deal with provider-specific response objects.\n    # ELI5: Hand back just the answer.\n    return r.choices[0].message.content\n\n# WHY (tech): Same function, different arguments: switching provider needs no code changes.\n# ELI5: Change one word to call a different company.\n#print(ask(\"gemini\", \"gemini-flash-latest\", PROMPT))\nprint(ask(\"groq\", \"openai/gpt-oss-120b\", PROMPT))", "o": "An invoice is a formal document issued by a seller to a buyer that itemizes goods or services provided, states the amount owed, and requests payment by a specified due date."}, {"t": "markdown", "s": "## 7. Experiment: see temperature in action\nSame prompt, run 3 times at low vs high temperature. Low → nearly identical answers. High → more varied."}, {"t": "code", "s": "# WHY (tech): Open-ended creative question, where randomness visibly changes outputs, making temperature effects obvious.\n# ELI5: A question with many possible answers, so differences show up.\nq = \"Give me a catchy name for a procurement analytics startup. Reply with the name only.\"\n\n# WHY (tech): Loops over two temperature values to compare deterministic and highly random sampling.\n# ELI5: Try the safe setting first, then the adventurous one.\nfor t in [0.0, 1.5]:\n    # WHY (tech): f-string inserts t into a heading; \\n adds a blank line for readability.\n    # ELI5: Print a label showing which setting is running.\n    print(f\"\\n--- temperature = {t} ---\")\n    # WHY (tech): Repeats the identical request 3 times to measure output variance at this temperature.\n    # ELI5: Ask the same question three times.\n    for i in range(3):\n        # WHY (tech): Groq is used because it still accepts temperature; Claude's API no longer does.\n        # ELI5: Use Groq, which still has the creativity knob.\n        resp = groq.chat.completions.create(\n            # WHY (tech): Small, fast chat model; cheap for running many repeated test calls.\n            # ELI5: A quick brain for quick tests.\n            model=\"openai/gpt-oss-20b\",\n            # WHY (tech): Same question every time, so only temperature varies between runs.\n            # ELI5: Keep the question identical.\n            messages=[{\"role\": \"user\", \"content\": q}],\n            # WHY (tech): The variable under test; it rescales token probabilities before sampling.\n            # ELI5: Turn the creativity knob.\n            temperature=t,\n        )\n        # WHY (tech): Extracts the answer text; .strip() removes stray whitespace for cleaner comparison.\n        # ELI5: Print the answer neatly.\n        print(resp.choices[0].message.content.strip())\n\n# EXPECTED: at 0.0 the names barely change; at 1.5 they vary a lot.", "o": "--- temperature = 0.0 ---\nSpendSight\nSpendSight\nSpendSight\n\n--- temperature = 1.5 ---\nAcquisytics\nBidVision Analytics\nSpendScope"}, {"t": "code", "s": "# WHY (tech): Claude has no temperature setting, so we steer output variety through prompt instructions instead.\n# ELI5: No creativity knob, so we tell Claude how creative to be.\n# WHY (tech): Dictionary maps a label to a prompt, letting one loop test both styles.\n# ELI5: Two versions of the same question, each with a name tag.\nprompts = {\n    # WHY (tech): Asks for the most conventional answer, mimicking low-temperature behaviour.\n    # ELI5: \"Give me the obvious answer.\"\n    \"SAFE (like low temperature)\":\n        \"Give me the most obvious, conventional name for a procurement analytics startup. Reply with the name only.\",\n    # WHY (tech): Asks for novelty and bans predictable words, mimicking high-temperature behaviour.\n    # ELI5: \"Surprise me, and don't use the boring words.\"\n    \"CREATIVE (like high temperature)\":\n        \"Give me a bold, unusual, surprising name for a procurement analytics startup. Avoid common words like 'procure' or 'spend'. Reply with the name only.\",\n}\n\n# WHY (tech): .items() yields each (label, prompt) pair so both styles run through the same code.\n# ELI5: Go through each version one by one.\nfor label, p in prompts.items():\n    # WHY (tech): Prints a heading so outputs from each prompt style are easy to compare.\n    # ELI5: Print which version is running.\n    print(f\"\\n--- {label} ---\")\n    # WHY (tech): Three identical calls show how much Claude's output varies for each prompt.\n    # ELI5: Ask each version three times.\n    for i in range(3):\n        resp = claude.messages.create(\n            # WHY (tech): Same Claude model for both styles, so only the prompt wording differs.\n            # ELI5: Same brain each time.\n            model=\"claude-sonnet-5-5\",\n            # WHY (tech): A low cap suits one-name answers and keeps repeated calls cheap.\n            # ELI5: Only a few words allowed.\n            max_tokens=50,\n            # WHY (tech): Sends the current prompt variant; no temperature, since Claude's API removed it.\n            # ELI5: Send this version of the question.\n            messages=[{\"role\": \"user\", \"content\": p}],\n        )\n        # WHY (tech): First content block holds the text; .strip() tidies whitespace.\n        # ELI5: Print Claude's answer neatly.\n        print(resp.content[0].text.strip())\n\n# TAKEAWAY: Groq = same prompt, temperature changes variety. Claude = same settings, prompt wording changes variety.", "o": "--- SAFE (like low temperature) ---\nProcurify\nProcurify\nProcurify\n\n--- CREATIVE (like high temperature) ---\nQuillfire\nLedgerfox\nQuillfire"}, {"t": "markdown", "s": "## Common errors\n| Error | Meaning | Fix |\n|---|---|---|\n| `SecretNotFoundError` | Secret name doesn't match, or notebook access is off | Check the spelling in 🔑 and turn on the toggle |\n| `401 / invalid api key` | Wrong or expired key | Create a new key and paste it again |\n| `404 / model not found` | Model name retired or misspelled | Run the list-models line and pick a current name |\n| `429 / rate limit / quota` | Free-tier limit reached, or no credits | Wait a minute, or add billing |"}] },

const GOA = [["November",34],["between",23],["from",16],["during",9],["in",7],["winter",5],["October",3],["December",2]];
function tempProbs(T){
  if (T < 0.05){ const m = Math.max(...GOA.map(g => g[1])); return GOA.map(g => g[1] === m ? 1 : 0); }
  const w = GOA.map(g => Math.pow(g[1], 1 / T)), sum = w.reduce((a, b) => a + b, 0);
  return w.map(x => x / sum);
}

function bindTemperature(){
  const sl = $("#tslider"), rows = [...document.querySelectorAll("#ttoks .tok")];

      r.querySelector(".pct").textContent = Math.round(p[i] * 100) + "%"; });
    molT = T;
  };
  const pick = () => {
    const p = tempProbs(+sl.value); let x = Math.random(), i = 0;
    for (; i < p.length - 1; i++){ x -= p[i]; if (x <= 0) break; }
    return i;
  };
  const show = idx => {

      `<span>· favourite picked ${fav} of ${picks.length}</span>`;

    $("#tprompt").textContent = "The best time to visit Goa is …"; $("#thist").innerHTML = "<span>Your picks will show here.</span>"; };
  $("#tgen").onclick = () => { const i = pick(); picks.push(i); show(i); };

  draw();
  startMolecules();
}

/* molecule canvas: speed follows the temperature slider */
let molT = 0.9, molRaf = 0;
function stopMolecules(){ cancelAnimationFrame(molRaf); molRaf = 0; }
function startMolecules(){
  const c = $("#mol"); if (!c) return;
  const ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const size = () => { c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; };
  size();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pts = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random(), a: Math.random() * Math.PI * 2 }));
  const frame = () => {
    if (!document.body.contains(c)) return;
    if (c.width !== c.clientWidth * dpr) size();
    const cs = getComputedStyle(document.documentElement);
    const W = c.width, H = c.height, sp = 0.0006 + molT * 0.0045;
    ctx.clearRect(0, 0, W, H);
    pts.forEach(p => {
      if (!still){
        p.a += (Math.random() - .5) * 0.4 * molT;
        p.x += Math.cos(p.a) * sp * (H / W); p.y += Math.sin(p.a) * sp;
        if (molT < 0.05) p.y += 0.004;
        if (p.x < 0.02 || p.x > 0.98){ p.a = Math.PI - p.a; p.x = Math.min(.98, Math.max(.02, p.x)); }
        if (p.y < 0.05 || p.y > 0.95){ p.a = -p.a; p.y = Math.min(.95, Math.max(.05, p.y)); }
      }
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 4.5 * dpr, 0, Math.PI * 2);
      ctx.fillStyle = molT > 1 ? cs.getPropertyValue("--bad") : cs.getPropertyValue("--accent"); ctx.fill();
    });
    if (!still) molRaf = requestAnimationFrame(frame);
  };
  frame();
}

/* tiny markdown renderer for notebook text cells: headings, tables, lists, bold, inline code */
function md(src){
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  const lines = src.split("\n"), out = []; let i = 0;
  while (i < lines.length){
    const l = lines[i];
    if (/^#{1,6} /.test(l)){ const n = l.match(/^#+/)[0].length; out.push(`<p class="nb-h nb-h${n}">${inline(l.replace(/^#+ /, ""))}</p>`); i++; }
    else if (l.trim().startsWith("|")){
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((_, k) => k !== 1);
      out.push(`<div class="tbl"><table><thead><tr>${cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    else if (/^\d+\. /.test(l)){ const it = []; while (i < lines.length && /^\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\d+\. /, "")); out.push(`<ol>${it.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`); }
    else if (l.trim()){ out.push(`<p>${inline(l)}</p>`); i++; }
    else i++;
  }
  return out.join("");
}

    <div class="tags"><span class="tag">safety filters</span><span class="tag">speech to text</span><span class="tag">text to speech</span></div></div>`;

  if (kind === "temperature") return `<div class="widget"><span class="eyebrow">Drag the temperature</span>
    <div class="temp-row"><span class="mono">temperature</span><input type="range" id="temp" min="0" max="1" step="0.1" value="0.2" aria-label="Temperature"><span class="temp-val" id="tempVal">0.2</span></div>
    <div class="scale"><span>predictability</span><span>creativity</span></div>
    <div class="temp-out" id="tempOut"></div></div>`;

  if (kind === "errors") return `<div class="tbl"><table><thead><tr><th>Error</th><th>Layer</th></tr></thead><tbody>
    ${s.errors.map(([e,l])=>`<tr><td class="mono">${esc(e)}</td><td>${esc(l)}</td></tr>`).join("")}</tbody></table></div>
    <div class="widget quiz" id="quiz"><span class="eyebrow">Which layer broke?</span>
      <div class="quiz-q" id="qq"></div><div class="opts" id="qo"></div>
      <div class="quiz-foot"><span>Score <b id="qs">0</b> / <b id="qt">0</b></span><button class="btn" id="qn" disabled>Next error</button></div></div>`;
  return "";
}

function bind(){
  document.querySelectorAll(".lesson-head").forEach(btn => btn.onclick = () => toggle(btn.parentElement));
  $("#expandAll").onclick = e => {
    const all = [...document.querySelectorAll(".lesson")], open = all.some(a => !a.classList.contains("open"));
    all.forEach(a => toggle(a, open)); e.target.textContent = open ? "Collapse all" : "Expand all";
  };
  document.querySelectorAll(".done-toggle").forEach(b => b.onclick = () => {
    const k = b.dataset.key; done[k] = !done[k]; if (!done[k]) delete done[k]; store.set("fieldnotes-done", done);
    b.closest(".lesson").classList.toggle("done", !!done[k]);
    b.textContent = done[k] ? "✓ Understood" : "Mark as understood"; progress();
  });

  // steps
  const notes = ["your key proves who you are", "pick which model answers", "send text", "get text back"];
  document.querySelectorAll(".step").forEach(b => b.onclick = () => {
    document.querySelectorAll(".step").forEach(x => x.classList.toggle("on", x === b));
    $("#flowNote").textContent = `step ${+b.dataset.step + 1} of 4 · ${notes[b.dataset.step]}`;
  });

  // swap
  const code = p => `client = OpenAI(\n    api_key=...,\n    <span class="hl">base_url="&lt;${p} base_url&gt;"</span>,\n)\nask("Hello")   <span style="color:var(--muted)"># same function, different provider</span>`;
  if ($("#swapCode")) $("#swapCode").innerHTML = code("Groq");
  document.querySelectorAll("[data-prov]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-prov]").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("#swapCode").innerHTML = code(b.dataset.prov);
  });

  // tradeoffs
  document.querySelectorAll(".pair").forEach(r => r.querySelectorAll("button").forEach(b => b.onclick = () =>
    r.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b))));

  // temperature
  const t = $("#temp");
  if (t){ const upd = () => { const v = +t.value; $("#tempVal").textContent = v.toFixed(1);
      $("#tempOut").textContent = v <= 0.3 ? "Low: suits extraction or contract checks."
        : v >= 0.7 ? "Higher: suits brainstorming." : "Middle: trading predictability for creativity."; };
    t.oninput = upd; upd(); }

  if ($("#quiz")) quiz(current.errors);
}

function toggle(el, force){
  const open = force === undefined ? !el.classList.contains("open") : force;
  el.classList.toggle("open", open);
  el.querySelector(".lesson-head").setAttribute("aria-expanded", open);
  el.querySelector(".lesson-body").hidden = !open;
}

function quiz(errors){
  const layers = errors.map(e => e[1]);
  let order = errors.map((_, i) => i).sort(() => Math.random() - .5), pos = 0, score = 0, answered = 0;
  const show = () => {
    const [err, layer] = errors[order[pos]];
    $("#qq").textContent = err; $("#qn").disabled = true;
    $("#qo").innerHTML = layers.map(l => `<button>${esc(l)}</button>`).join("");
    $("#qo").querySelectorAll("button").forEach(b => b.onclick = () => {
      if (!$("#qn").disabled) return;
      answered++; if (b.textContent === layer) score++;
      $("#qo").querySelectorAll("button").forEach(x => {
        if (x.textContent === layer) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
      $("#qs").textContent = score; $("#qt").textContent = answered;
      $("#qn").disabled = false; $("#qn").textContent = pos === errors.length - 1 ? "Start again" : "Next error";
    });
  };
  $("#qn").onclick = () => { pos++; if (pos >= errors.length){ pos = 0; score = 0; answered = 0;
      order.sort(() => Math.random() - .5); $("#qs").textContent = 0; $("#qt").textContent = 0; } show(); };
  show();
}

window.addEventListener("hashchange", () => {
  view = location.hash === "#learning-concepts" ? "concepts" : "topic";
  current = SESSIONS.find(s => "#" + s.id === location.hash) || SESSIONS[0]; render();
  const first = document.querySelector(".lesson"); if (first) toggle(first, true);
});
render();
const firstLesson = document.querySelector(".lesson"); if (firstLesson) toggle(firstLesson, true);
</script>
